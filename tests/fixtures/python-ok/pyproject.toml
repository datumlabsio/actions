[project]
name = "datum-fixture"
version = "0.1.0"
description = "Fixture project that python-ci runs against in self-test."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datum_fixture"]

# Path-shaped settings live here, in the repo, never in the vendored configs.
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
