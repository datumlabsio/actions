# datum-config: mypy v1
# Vendored from datumlabsio/actions/configs/mypy.ini. Bump it, do not edit it.
#
# Rules only — no `files`, no `mypy_path`, no per-module overrides. Those are
# path-shaped and belong in the repo's own config.
#
# Deliberately not --strict. A gate that nothing can pass gets switched off,
# and a switched-off gate is worse than a modest one that holds everywhere.

[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True
disallow_untyped_defs = False
ignore_missing_imports = True
show_error_codes = True
pretty = True
