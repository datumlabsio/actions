# DES §3: a pre-commit config in the repo, and a CI stage running the same
# hooks. This is the fixture's copy, so python-ci's pre-commit stage is
# exercised in self-test rather than assumed.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # A Helm chart's templates/ holds Go templates, not YAML. check-yaml
        # cannot parse them, and `pre-commit run --all-files` walks the whole git
        # repo — so this fixture's hooks see the gitops fixture's charts too.
        # The scaffold ships the same exclusion for the same reason.
        exclude: '(^|/)charts/[^/]+/templates/'
      - id: check-added-large-files
