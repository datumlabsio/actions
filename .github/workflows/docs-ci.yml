name: docs-ci

# Reusable CI for the `docs` archetype (DES §8). Callers pin a version tag:
#
#   jobs:
#     ci:
#       uses: datumlabsio/actions/.github/workflows/docs-ci.yml@v0.1.0
#       with:
#         placeholder-paths: "standards/ vision/"
#
# Every check is off by default except conflict markers and the link check.
# A repo turns on what applies to it. See docs/docs-ci.md.

on:
  workflow_call:
    inputs:
      runner-label:
        description: >-
          Runner to schedule on. Leave at the default and every job runs on
          GitHub-hosted runners. Set it to a self-hosted label (datumlabsio
          uses "datum") only for a repo whose runner group actually grants
          that runner — a label no runner answers queues the job for 24
          hours rather than failing it.

          The org variable DATUM_RUNNER_OFFLINE is a kill switch over the
          top: while it is "true", every job here goes back to
          ubuntu-latest regardless of this input, so a dead runner does not
          stop merges. .github/workflows/runner-watch.yml keeps that
          variable honest; nothing here needs a credential to read it.
        type: string
        default: "ubuntu-latest"

      link-check:
        description: "Check that every relative markdown link resolves."
        type: boolean
        default: true

      placeholder-paths:
        description: >-
          Space-separated paths where TODO and TBD must not appear.
          Empty skips the check.
        type: string
        default: ""

      vocabulary-denylist:
        description: >-
          Pipe-separated terms that must not appear (retired vocabulary).
          Empty skips the check.
        type: string
        default: ""

      vocabulary-scan-paths:
        description: "Space-separated paths to scan for the denylist."
        type: string
        default: "."

      vocabulary-allow-files:
        description: >-
          Pipe-separated path fragments exempt from the denylist — history
          notes, terminology bridges, rejected proposals.
        type: string
        default: ""

      rfc-dir:
        description: >-
          Directory holding numbered proposals. Set together with spec-dir to
          check that a proposal is not left in Draft while its changes ship.
        type: string
        default: ""

      spec-dir:
        description: "Directory holding the specs that proposals change."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  docs:
    runs-on: ${{ vars.DATUM_RUNNER_OFFLINE == 'true' && 'ubuntu-latest' || inputs.runner-label }}
    steps:
      - name: Check out
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # EVERY file, not just markdown. `copier update` leaves conflict markers
      # in place and still exits 0, so a `scaffold-update` pull request can carry
      # a broken file and report success. With `--include='*.md'` the only thing
      # that noticed was luck:
      #
      #   - the marker gate skipped it — not markdown
      #   - actionlint skipped it — not a workflow
      #   - the `check-merge-conflict` pre-commit hook never ran — it lives inside
      #     python-ci, and a gitops repo has no Python (B-66)
      #
      # A conflicted `.pre-commit-config.yaml` merged green while no longer being
      # valid YAML. Three gaps lined up; this closes the one that costs a word.
      #
      # `.git` is excluded because a rebase in progress legitimately holds markers
      # in its own metadata.
      # ---------------------------------------------------------------------
      # EVERY GATE BELOW RUNS EVEN WHEN THE ONE BEFORE IT FAILED
      # ---------------------------------------------------------------------
      #
      # A step's `if:` carries an implicit `success()`, so one failing gate used
      # to SKIP every gate after it — while the job stayed exactly as red as
      # before, so nothing looked different. In polaris that hid every
      # introspector test on every pull request that touched them.
      #
      # `!cancelled()` replaces the implicit success(): each gate runs and
      # reports for itself, and the job still fails if ANY of them failed. No
      # gate is weakened; a red run stays red. It stops hiding the failures
      # behind the first one.
      #
      # `steps.checkout.outcome == 'success'` is the other half: if setup failed
      # there is nothing to run a gate against, and every tool failing on a
      # missing environment would bury the one error that matters.
      - name: No conflict markers
        id: conflict_markers
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          if grep -rn '^<<<<<<< \|^>>>>>>> ' --exclude-dir=.git . ; then
            echo "::error::Conflict markers left in a merged file."
            exit 1
          fi
          echo "No conflict markers, in any file."

      - name: Relative links resolve
        id: links
        if: ${{ (inputs.link-check) && !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import re, os, sys
          bad = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d != '.git']
              for f in files:
                  if not f.endswith('.md'):
                      continue
                  p = os.path.join(root, f)
                  with open(p, encoding='utf-8', errors='replace') as fh:
                      text = fh.read()
                  # Code is not a link. A docs repo that documents markdown
                  # syntax would otherwise fail on its own examples.
                  text = re.sub(r'```.*?```', '', text, flags=re.S)
                  text = re.sub(r'`[^`\n]*`', '', text)
                  for m in re.finditer(r'\]\(([^)#\s]+)(?:#[^)]*)?\)', text):
                      t = m.group(1)
                      if t.startswith(('http', 'mailto')):
                          continue
                      if not os.path.exists(os.path.normpath(os.path.join(root, t))):
                          bad.append(f"{p} -> {t}")
          if bad:
              print("::error::Broken relative links:")
              for b in bad:
                  print(f"  {b}")
              sys.exit(1)
          print("All relative links resolve.")
          PY

      - name: No placeholder rot
        id: placeholder_rot
        if: ${{ (inputs.placeholder-paths != '') && !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          PATHS: ${{ inputs.placeholder-paths }}
        run: |
          python3 - <<'PY'
          import os, re, sys

          hits = []
          for base in os.environ['PATHS'].split():
              if os.path.isfile(base):
                  targets = [base]
              elif os.path.isdir(base):
                  targets = []
                  for root, dirs, files in os.walk(base):
                      dirs[:] = [d for d in dirs if d != '.git']
                      targets += [os.path.join(root, f)
                                  for f in files if f.endswith('.md')]
              else:
                  print(f"::error::placeholder-paths names '{base}', which does not exist.")
                  sys.exit(1)

              for p in sorted(targets):
                  with open(p, encoding='utf-8', errors='replace') as fh:
                      lines = fh.read().splitlines()
                  # Scanned line by line so reported line numbers are real.
                  # Code is skipped: documenting the word TODO is not the same
                  # as leaving one. An HTML comment is NOT skipped — a note to
                  # self in a comment is exactly the thing this check is for.
                  in_fence = False
                  for n, line in enumerate(lines, 1):
                      if line.lstrip().startswith('```'):
                          in_fence = not in_fence
                          continue
                      if in_fence:
                          continue
                      prose = re.sub(r'`[^`]*`', '', line)
                      if re.search(r'\bTODO\b|\bTBD\b', prose):
                          hits.append(f"{p}:{n}: {line.strip()}")

          if hits:
              print("::error::TODO or TBD in a path that must be finished prose:")
              for h in hits:
                  print(f"  {h}")
              sys.exit(1)
          print(f"No placeholder rot in: {os.environ['PATHS']}")
          PY

      - name: No retired vocabulary
        id: retired_vocabulary
        if: ${{ (inputs.vocabulary-denylist != '') && !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          DENYLIST: ${{ inputs.vocabulary-denylist }}
          ALLOW: ${{ inputs.vocabulary-allow-files }}
        run: |
          hits=$(grep -rnE "$DENYLIST" --include='*.md' ${{ inputs.vocabulary-scan-paths }} || true)
          if [ -n "$ALLOW" ]; then
            hits=$(printf '%s\n' "$hits" | grep -vE "$ALLOW" || true)
          fi
          if [ -n "$hits" ]; then
            echo "::error::Retired vocabulary outside the allowlist:"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "No retired vocabulary."

      # A proposal and the spec change it causes land on the same pull request.
      # The proposal's status flips on that pull request, never afterwards — so
      # a pull request that ships spec text while leaving its proposal in Draft
      # leaves the repository saying two different things.
      - name: Proposal status matches what shipped
        id: proposal_status
        if: ${{ (github.event_name == 'pull_request' && inputs.rfc-dir != '' && inputs.spec-dir != '') && !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          RFC_DIR: ${{ inputs.rfc-dir }}
          SPEC_DIR: ${{ inputs.spec-dir }}
        run: |
          # This used to skip. It now fails, deliberately.
          #
          # The gate guards the Draft-to-Accepted flip, which was missed three
          # times by hand (RFC-0008, RFC-0009, RFC-0011) before it existed. It is
          # the wrong gate to let pass quietly.
          #
          # Checkout above uses fetch-depth: 0, and `main` carries
          # non_fast_forward protection, so the base commit being absent is not a
          # normal condition — it means something rewrote history or the event
          # payload is not what it claims. A rerun will not fix that, and a green
          # tick would say the proposal was checked when it was not.
          if ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "::error::Base commit $BASE is not in this checkout, so proposal status could not be checked."
            echo "::error::Checkout is full-depth and main is protected, so this is not expected — investigate rather than rerun."
            exit 1
          fi

          changed=$(git diff --name-only "$BASE" HEAD)
          spec_changed=$(printf '%s\n' "$changed" | grep "^$SPEC_DIR" || true)
          rfcs_changed=$(printf '%s\n' "$changed" | grep "^$RFC_DIR.*\.md$" || true)

          if [ -z "$spec_changed" ] || [ -z "$rfcs_changed" ]; then
            echo "Not a proposal-plus-spec pull request; nothing to check."
            exit 0
          fi

          # Read line by line rather than relying on word splitting: a path with
          # a space in it would otherwise be silently skipped, and a silently
          # skipped check is worse than no check.
          fail=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$(basename "$f")" in TEMPLATE.md) continue ;; esac
            [ -f "$f" ] || continue
            line=$(grep -m1 '^- \*\*Status:\*\*' "$f" || true)
            if [ -z "$line" ]; then
              echo "::error file=$f::No '- **Status:**' line found. Every proposal declares a status."
              fail=1
              continue
            fi
            case "$line" in
              *Draft*)
                echo "::error file=$f::This pull request changes $SPEC_DIR but leaves $f at Status: Draft. Flip it on this pull request, not afterwards."
                fail=1
                ;;
            esac
          done <<< "$rfcs_changed"

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Every changed proposal has a settled status."

      # A gate that skips itself and a gate that passes are indistinguishable from
      # outside: both green, both exit 0. §11's quarantine check had never run in
      # polaris while CI reported success the whole time.
      #
      # `always()`, because a run that FAILED still has to say what it did — that
      # is exactly when the question gets asked.
      - name: What this run actually did
        if: always()
        env:
          WORKDIR: "."
          REQUESTED: >-
            conflict-markers:true
            links:${{ inputs.link-check }}
            placeholder-rot:${{ inputs.placeholder-paths != '' }}
            retired-vocabulary:${{ inputs.vocabulary-denylist != '' }}
            proposal-status:${{ github.event_name == 'pull_request' && inputs.rfc-dir != '' && inputs.spec-dir != '' }}
          # What each step DID, not what was asked of it. The summary used to
          # infer "ran" from the input alone, so a gate skipped behind an
          # earlier failure was reported as having run.
          OUTCOMES: >-
            conflict-markers:${{ steps.conflict_markers.outcome }}
            links:${{ steps.links.outcome }}
            placeholder-rot:${{ steps.placeholder_rot.outcome }}
            retired-vocabulary:${{ steps.retired_vocabulary.outcome }}
            proposal-status:${{ steps.proposal_status.outcome }}
        run: |
          set -euo pipefail
          skips="$RUNNER_TEMP/datum-skipped.txt"
          [ -f "$skips" ] || : > "$skips"

          outcome_of() {
            for pair in $OUTCOMES; do
              if [ "${pair%:*}" = "$1" ]; then
                echo "${pair##*:}"
                return
              fi
            done
          }

          passed=""; failed=""; off=""
          for pair in $REQUESTED; do
            name="${pair%:*}"
            on="${pair##*:}"
            if [ "$on" != "true" ]; then
              off="${off}${off:+, }${name}"
              continue
            fi
            # A gate that ran and chose to skip itself (a config not vendored)
            # says so in the skips file, and is listed from there below.
            if grep -q "^${name} " "$skips"; then
              continue
            fi
            case "$(outcome_of "$name")" in
              success) passed="${passed}${passed:+, }${name}" ;;
              failure) failed="${failed}${failed:+, }${name}" ;;
              # A step held back by `!cancelled()` reports `skipped`, not
              # `cancelled`, so the two are not told apart here. Both mean the
              # gate never ran, which is the fact that has to be visible.
              *) echo "${name} — did not run (setup failed, or the run was cancelled)" >> "$skips" ;;
            esac
          done

          skipped=$(paste -sd';' - < "$skips" | sed 's/;/; /g')

          {
            echo "### docs-ci — \`${WORKDIR:-.}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Passed | ${passed:-none} |"
            echo "| **Failed** | ${failed:-none} |"
            echo "| **Skipped** | ${skipped:-none} |"
            echo "| Off by config | ${off:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Loud in the log too, so it is visible without opening the summary tab.
          if [ -n "$skipped" ]; then
            echo "::warning::Gates skipped: ${skipped}"
          fi
