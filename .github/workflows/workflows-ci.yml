name: workflows-ci

# Reusable CI for a repo's own automation. Callers pin a version tag:
#
#   jobs:
#     workflows:
#       uses: datumlabsio/actions/.github/workflows/workflows-ci.yml@v0.9.0
#
# WHY THIS EXISTS. Every repo in the org has workflows, and nothing checked them
# except this repo's own self-test. Two failures were already paid for here:
#
#   1. A duplicated job key. PyYAML silently keeps the last duplicate, so a YAML
#      parse passes and Actions sees a workflow missing a job.
#   2. A called workflow requesting more permissions than its caller granted.
#
# Both fail at STARTUP, producing no log to read — the run is just
# `startup_failure`. Both are things actionlint catches and a parser cannot.
# They broke this repo's main branch once. That is not a lesson worth every repo
# in the org learning separately.
#
# The pin check is the other half. DES §4 requires a thin caller to pin an exact
# version tag, and a pin that does not resolve satisfies the letter of that rule
# while failing in the first repo somebody creates — as `workflow not found`,
# which reads like their mistake rather than the template's.

on:
  workflow_call:
    inputs:
      actionlint:
        description: "Lint every workflow with actionlint. Also runs shellcheck over run: blocks."
        type: boolean
        default: true

      actionlint-version:
        description: "Pinned, so a new actionlint release cannot change what CI accepts overnight."
        type: string
        default: "1.7.12"

      verify-pins:
        description: >-
          For every `uses: datumlabsio/actions/...@ref`, confirm the workflow
          exists at that ref and declares each input and secret being passed to
          it. Needs no token for public refs.
        type: boolean
        default: true

      validate-renovate:
        description: >-
          Validate any Renovate config present. A config Renovate cannot read
          does not error — it matches nothing and reports success, which is
          indistinguishable from "everything is current".
        type: boolean
        default: true

      renovate-version:
        description: "Validate against the major that actually runs, not whatever npx resolves."
        type: string
        default: "44"

      working-directory:
        description: >-
          Where to look. A monorepo component keeps its own workflows, and
          this repo's self-test points it at fixtures to prove the gate
          actually blocks rather than asserting that it does.
        type: string
        default: "."

permissions:
  contents: read

jobs:
  lint:
    if: ${{ inputs.actionlint }}
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: ${{ inputs.actionlint-version }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lint every workflow
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [ ! -d .github/workflows ]; then
            echo "::notice::No .github/workflows directory. Nothing to lint."
            exit 0
          fi
          curl -sSL --fail \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint -version
          ./actionlint
          echo "All workflows lint clean."

      # actionlint does not flag this: it is valid YAML and a valid trigger.
      #
      # A fork's pull request normally runs with a READ-ONLY token and no
      # secrets -- that is the protection. `pull_request_target` runs in the
      # BASE repository's context instead, so checking out the fork's code
      # executes somebody else's script with a writable token and every secret
      # in the repository.
      #
      # It looks like the fix for a real limitation, it works, and review does
      # not catch it unless the reviewer knows this specific trap. `actions` and
      # `.github` are PUBLIC -- anyone can open a pull request on them, and
      # `.github` is where the datum-police credentials are reachable.
      - name: No workflow triggers on pull_request_target
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          python3 - <<'PRT_CHECK'
          import re, sys
          from pathlib import Path

          TRIGGER = "pull_request_target"
          WF = Path(".github/workflows")
          if not WF.is_dir():
              print("::notice::No .github/workflows directory. Nothing to check.")
              sys.exit(0)


          def offending(text):
              """Lines that TRIGGER on it, ignoring comments and prose.

              A check that flags its own documentation is one people delete, so
              only the `on:` block counts and comments never do.
              """
              out, in_on = [], False
              for n, raw in enumerate(text.split("\n"), 1):
                  line = "" if raw.lstrip().startswith("#") else raw.split("#", 1)[0]
                  if not line.strip():
                      continue
                  if re.match(r"^on\s*:", line):
                      in_on = True
                      if TRIGGER in line:
                          out.append((n, raw.strip()))
                      continue
                  if in_on and re.match(r"^\S", line):
                      in_on = False
                  if in_on and TRIGGER in line:
                      out.append((n, raw.strip()))
              return out


          found, checked = [], 0
          for f in sorted(list(WF.glob("*.yml")) + list(WF.glob("*.yaml"))):
              checked += 1
              for n, line in offending(f.read_text(encoding="utf-8", errors="replace")):
                  found.append((f, n, line))

          if not found:
              print(f"No workflow triggers on {TRIGGER}. Checked {checked}.")
              sys.exit(0)

          for f, n, line in found:
              print(f"::error file={f},line={n}::{TRIGGER} gives a fork's pull "
                    "request a writable token and every secret in this repository. "
                    "Anyone can open a pull request on a public repo.")
              print(f"  {f}:{n}  {line}")
          print("""
            Instead, depending on what you were trying to do:

              comment on or label a fork's pull request
                -> a separate workflow on `workflow_run`, which gets a writable
                   token WITHOUT ever checking out the fork's code

              read the fork's code
                -> `on: pull_request`. Read-only, no secrets -- correct, because
                   it is somebody else's code

              a check that genuinely needs secrets against a fork
                -> it needs a human. Use an environment with required reviewers,
                   so somebody approves before the code runs
          """)
          sys.exit(1)
          PRT_CHECK

  pins:
    if: ${{ inputs.verify-pins }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Every datumlabsio/actions pin resolves and accepts what it is passed
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import sys, urllib.request
          from pathlib import Path

          import yaml

          WF = Path(".github/workflows")
          if not WF.is_dir():
              print("::notice::No .github/workflows directory. Nothing to verify.")
              sys.exit(0)

          PREFIX = "datumlabsio/actions/.github/workflows/"

          def triggers(doc):
              """YAML 1.1 parses a bare `on` as the boolean True.

              So a called workflow's trigger block is doc[True], not doc["on"].
              Reading only doc["on"] would find nothing, declare every caller
              valid, and pass forever — the exact silent success this job exists
              to prevent.
              """
              return doc.get("on") or doc.get(True) or {}

          def fetch(ref, wf):
              url = f"https://raw.githubusercontent.com/datumlabsio/actions/{ref}/.github/workflows/{wf}"
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      return r.read().decode()
              except Exception as exc:  # noqa: BLE001
                  return None if getattr(exc, "code", None) == 404 else False

          def declares(text):
              call = triggers(yaml.safe_load(text)).get("workflow_call") or {}
              return set(call.get("inputs") or {}) | set(call.get("secrets") or {})

          def line_of(path, needle):
              for n, line in enumerate(path.read_text().splitlines(), 1):
                  if needle in line and not line.lstrip().startswith("#"):
                      return n
              return 0

          problems, checked, cache = [], 0, {}

          for f in sorted(list(WF.glob("*.yml")) + list(WF.glob("*.yaml"))):
              try:
                  doc = yaml.safe_load(f.read_text())
              except yaml.YAMLError as exc:
                  problems.append(f"{f}: will not parse as YAML: {exc}")
                  continue
              if not isinstance(doc, dict):
                  continue

              for job_name, job in (doc.get("jobs") or {}).items():
                  if not isinstance(job, dict):
                      continue
                  uses = job.get("uses")
                  if not isinstance(uses, str) or not uses.startswith(PREFIX):
                      continue

                  checked += 1
                  wf, _, ref = uses[len(PREFIX):].partition("@")
                  where = f"{f}:{line_of(f, uses)} (job '{job_name}')"

                  if not ref:
                      problems.append(f"{where}: no version pin. DES §4 requires an exact version tag.")
                      continue

                  if (ref, wf) not in cache:
                      cache[(ref, wf)] = fetch(ref, wf)
                  text = cache[(ref, wf)]

                  if text is False:
                      print(f"::warning::{where}: could not reach {wf}@{ref}. Skipped, not failed.")
                      continue
                  if text is None:
                      problems.append(
                          f"{where}: {wf} does not exist at {ref}. A pin that does not "
                          f"resolve fails as 'workflow not found' in the first repo that calls it."
                      )
                      continue

                  have = declares(text)
                  want = set(job.get("with") or {})
                  secrets = job.get("secrets")
                  if isinstance(secrets, dict):
                      want |= set(secrets)

                  missing = sorted(want - have)
                  if missing:
                      problems.append(
                          f"{where}: {wf}@{ref} does not declare {missing}. "
                          f"An input that does not exist is a startup failure with no log."
                      )

          if problems:
              print(f"{len(problems)} unresolved pin(s) (DES §4):", file=sys.stderr)
              for problem in problems:
                  print(f"  {problem}", file=sys.stderr)
              sys.exit(1)

          print(f"{checked} datumlabsio/actions pin(s) resolve and accept what they are passed.")
          PY

  renovate:
    if: ${{ inputs.validate-renovate }}
    runs-on: ubuntu-latest
    env:
      RENOVATE_VERSION: ${{ inputs.renovate-version }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate every Renovate config present
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          files=""
          for f in default.json renovate.json .renovaterc .renovaterc.json; do
            [ -f "$f" ] && files="$files $f"
          done
          if [ -z "$files" ]; then
            echo "::notice::No Renovate config in this repo. Nothing to validate."
            exit 0
          fi
          echo "Validating:$files"
          # shellcheck disable=SC2086
          npx --yes --package "renovate@${RENOVATE_VERSION}" renovate-config-validator $files
