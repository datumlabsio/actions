name: security-baseline

# DES §6, the security half. Callers pin a version tag:
#
#   jobs:
#     security:
#       uses: datumlabsio/actions/.github/workflows/security-baseline.yml@v0.11.0
#
# Three things, all open source and all free, because the paid alternatives are
# priced per repository or per committer and 223 of the org's 228 repos are
# private:
#
#   Semgrep  (LGPL-2.1)  static analysis
#   gitleaks (MIT)       secret detection
#   audit                dependency advisories, per ecosystem
#
# WHY GITLEAKS AND NOT GITHUB SECRET SCANNING. GitHub's is better — it refuses
# the push, so the credential never reaches the remote at all. It is also a paid
# add-on on private repos. gitleaks fails the pull request instead, by which
# point the secret is already on a branch and must be rotated regardless. That is
# a real reduction, not a like-for-like swap, and §6 says so rather than
# pretending otherwise.

on:
  workflow_call:
    inputs:
      semgrep:
        description: "Static analysis. A finding fails the job."
        type: boolean
        default: true

      semgrep-registry-configs:
        description: >-
          Space-separated community packs, fetched from the registry. Kept
          alongside the vendored Datum rules rather than instead of them.
        type: string
        default: "p/default p/secrets"

      gitleaks:
        description: "Secret detection over the commits this pull request adds."
        type: boolean
        default: true

      dependency-audit:
        description: >-
          Advisories in the dependency tree. Reports rather than fails: the fix
          is a Renovate bump, and blocking on something the author cannot resolve
          in their own pull request teaches people to ignore the gate.
        type: boolean
        default: true

      working-directory:
        type: string
        default: "."

      semgrep-version:
        description: >-
          Fallback Semgrep version, used only when no vendored
          `security-tool-versions.txt` pins one. Exists so a repository we do not
          scaffold can adopt this with ONE file instead of two.
        type: string
        default: "1.174.0"

      gitleaks-version:
        description: "Fallback gitleaks version. Same reasoning as semgrep-version."
        type: string
        default: "8.30.1"

      config-dir:
        description: "Where the vendored configs live, relative to working-directory."
        type: string
        default: "."

      suppress-placeholder-keys:
        description: >-
          Drop detected-private-key findings whose PEM block provably contains
          no private bytes -- a real key header truncated for documentation.
          Every suppression is printed. Set false for raw Semgrep output.
        type: boolean
        default: true

permissions:
  contents: read

# STAMPED BY release.yml WHEN A TAG IS CUT. Do not edit by hand.
#
# 0000-00-00 is the working-copy value and means "not a release". A branch must
# never expire, or this repository's own CI would rot after a year.
env:
  DATUM_RELEASED_ON: "0000-00-00" # datum-release-stamp
  DATUM_MAX_AGE_DAYS: "365"

jobs:
  # A PINNED SECURITY SCANNER AGES INTO FALSE ASSURANCE. It goes green because
  # its rules are old, not because the code is clean -- and the repository most
  # likely to be running a two-year-old pin is one nobody maintains any more.
  #
  # So a release stops scanning after a year and says so, loudly, on every run.
  # It PASSES rather than fails: breaking the build of a repository we no longer
  # work on is not ours to do, and a warning on every pull request is what
  # actually gets the file deleted -- by the people who can delete it.
  #
  # No network call. The date travels inside the file they already pinned.
  age:
    runs-on: ubuntu-latest
    outputs:
      expired: ${{ steps.check.outputs.expired }}
    steps:
      - name: Is this release still maintained?
        id: check
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/age.py" <<'DATUM_AGE_CHECK'
          """Decide whether this release of the baseline is too old to be trusted.

          Prints `expired=true|false` and a reason. NEVER raises: an unreadable stamp
          must not be the reason a security gate stops scanning.
          """
          import datetime
          import os
          import sys

          UNSTAMPED = "0000-00-00"


          def decide(released_on: str, max_age_days: int, today: datetime.date):
              # The unstamped value is carried on main and every branch. A working copy is
              # not a release and must never expire, or our own CI rots after a year.
              if released_on == UNSTAMPED:
                  return False, "unstamped — not a release build"
              try:
                  released = datetime.date.fromisoformat(released_on)
              except ValueError:
                  # FAIL OPEN. A stamp we cannot read is a bug in our release process,
                  # not a reason to stop scanning the caller's code.
                  return False, f"stamp {released_on!r} is unreadable — kept scanning"
              if released > today:
                  # Clock skew, or a stamp from the future. Also fail open.
                  return False, f"released {released_on}, which is in the future — kept scanning"
              age = (today - released).days
              if age > max_age_days:
                  return True, f"released {released_on}, {age} days ago"
              return False, f"released {released_on}, {age} days ago"


          def main() -> int:
              expired, reason = decide(
                  os.environ.get("RELEASED_ON", UNSTAMPED),
                  int(os.environ.get("MAX_AGE_DAYS", "365")),
                  datetime.datetime.now(datetime.UTC).date(),
              )
              print(f"expired={'true' if expired else 'false'}")
              print(f"reason={reason}")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          DATUM_AGE_CHECK
          RELEASED_ON="$DATUM_RELEASED_ON" MAX_AGE_DAYS="$DATUM_MAX_AGE_DAYS" \
            python3 "$RUNNER_TEMP/age.py" > "$RUNNER_TEMP/age.out"
          cat "$RUNNER_TEMP/age.out" >> "$GITHUB_OUTPUT"

          expired=$(grep '^expired=' "$RUNNER_TEMP/age.out" | cut -d= -f2)
          reason=$(grep '^reason=' "$RUNNER_TEMP/age.out" | cut -d= -f2-)

          if [ "$expired" = "true" ]; then
            echo "::warning::This security baseline was $reason. It is no longer maintained and performs NO CHECKS. Update the pin to a current version, or delete this workflow file."
            {
              echo "### security-baseline — EXPIRED"
              echo
              echo "This workflow was **$reason**, past the ${DATUM_MAX_AGE_DAYS}-day limit."
              echo
              echo "**It scanned nothing.** A rule set this old reports green because it is"
              echo "out of date, not because the code is clean."
              echo
              echo "Update the pin to a current version of"
              echo "\`datumlabsio/actions\`, or delete this workflow file."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::security-baseline: $reason."
          fi

  semgrep:
    needs: age
    if: ${{ inputs.semgrep && needs.age.outputs.expired != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      CONFIG_DIR: ${{ inputs.config-dir }}
      REGISTRY_CONFIGS: ${{ inputs.semgrep-registry-configs }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The vendored file is PREFERRED, not required. Requiring it made adoption
      # a two-file job — the workflow and the config — which cannot be a
      # copy-paste, a starter template, or a single pull request. A repository we
      # did not scaffold has no vendored config and never will.
      #
      # Falling back is still pinned: the version comes from this workflow, which
      # is released and immutable. What is lost is Renovate bumping it in THEIR
      # repository, which is the correct trade for a repository that has no
      # Renovate.
      #
      # Which one was used is printed either way, so a scaffolded repository
      # cannot silently drift onto the fallback.
      - name: Install the pinned Semgrep
        env:
          FALLBACK: ${{ inputs.semgrep-version }}
        run: |
          set -euo pipefail
          p="$CONFIG_DIR/security-tool-versions.txt"
          version=""
          if [ -f "$p" ]; then
            if ! head -3 "$p" | grep -q '^# datum-config:'; then
              echo "::error::$p has no '# datum-config:' version stamp. A vendored config is bumped, never hand-written."
              exit 1
            fi
            version=$(grep '^semgrep=' "$p" | cut -d= -f2- || true)
          fi
          if [ -n "$version" ]; then
            echo "::notice::Semgrep $version, pinned in $p."
          else
            version="$FALLBACK"
            echo "::notice::No vendored semgrep pin, so $version is used. Vendor security-tool-versions.txt to let Renovate bump it here."
          fi
          pipx install "semgrep==$version" >/dev/null
          semgrep --version

      - name: Scan
        env:
          # Off deliberately. --config=auto and metrics both send project
          # metadata to semgrep.dev to pick rules and count usage. On private
          # repos that is telemetry nobody agreed to, and it sits badly beside
          # the no-literal-env-values gate this repo enforces on itself.
          SEMGREP_SEND_METRICS: "off"
        run: |
          set -euo pipefail
          args=""
          for c in $REGISTRY_CONFIGS; do args="$args --config=$c"; done

          local_rules="$CONFIG_DIR/semgrep.yml"
          if [ -f "$local_rules" ]; then
            args="$args --config=$local_rules"
          else
            echo "::notice::$local_rules not vendored yet — running the community packs only."
            echo "::notice::Copy it from datumlabsio/actions/configs/ to pick up the Datum-specific rules."
            echo "semgrep — community packs only, $local_rules not vendored" >> "$RUNNER_TEMP/datum-degraded.txt"
          fi

          # Semgrep keeps printing its own findings. --json-output gives the
          # placeholder filter something to read. A failing exit code is
          # decided in a later step, AFTER filtering, so a suppressed
          # placeholder cannot fail the job and a real finding still does.
          # shellcheck disable=SC2086
          semgrep scan $args --metrics=off --disable-version-check \
            --json-output="$RUNNER_TEMP/semgrep.json" . || true

          if [ ! -s "$RUNNER_TEMP/semgrep.json" ]; then
            echo "::error::Semgrep produced no JSON. Refusing to report a clean result while blind."
            exit 1
          fi

      # Setup documentation that shows how to paste a private key trips
      # detected-private-key. The block is a REAL key header truncated for
      # display, so the rule is right that these are key header bytes and wrong
      # that anything secret is present: what precedes the private section is a
      # fixed format header and the public key, and neither is a secret.
      #
      # This drops ONLY blocks proven to hold no private bytes, and prints every
      # suppression with its file, line and reason. Nothing is dropped quietly.
      - name: Set aside private-key matches that carry no key
        if: ${{ inputs.suppress-placeholder-keys }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/placeholder_keys.py" <<'DATUM_PLACEHOLDER_FILTER'
          """Suppress detected-private-key findings that provably contain NO private bytes.

          Semgrep's rule matches on the PEM header plus a base64-looking line, so
          documentation that writes `YOUR_KEY_HERE` never fires. The one shape that does
          is a REAL header truncated for display:

              -----BEGIN OPENSSH PRIVATE KEY-----
              b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAA...
              ... (full private key) ...
              -----END OPENSSH PRIVATE KEY-----

          Those leading bytes are byte-identical in every unencrypted OpenSSH key ever
          generated. They are not a secret, and they are the single most common false
          positive when this baseline meets a repository's setup docs.

          THE TEST IS NOT LENGTH. A PKCS#8 ed25519 private key is 48 bytes -- smaller
          than the 52-byte truncated header this exists to suppress. Any length
          threshold that catches the placeholder also throws away a real key.

          The test is whether the block contains any byte of the PRIVATE portion:

            1. no base64 body at all                        -> suppress
            2. OpenSSH, truncated before the private blob   -> suppress
            3. DER, truncated inside the first 16 bytes     -> suppress
                                                               (no algorithm's private
                                                                material begins earlier)

          Everything else is kept, including a real key whose middle has been elided for
          documentation. Partial key exposure is a real attack -- given enough bits of an
          RSA private key, the rest is recoverable -- so a block holding some genuine
          private bytes is a finding, not a placeholder.
          """
          import base64
          import json
          import os
          import re
          import sys

          RULE = "detected-private-key"
          BEGIN = re.compile(r"-----BEGIN (?:[A-Z0-9 ]+ )?PRIVATE KEY-----")
          END = re.compile(r"-----END (?:[A-Z0-9 ]+ )?PRIVATE KEY-----")
          B64_LINE = re.compile(r"^[A-Za-z0-9+/]+={0,2}$")
          OPENSSH_MAGIC = b"openssh-key-v1\x00"
          DER_MIN_PRIVATE_OFFSET = 16


          def pem_body(path, start_line):
              try:
                  lines = open(path, encoding="utf-8", errors="replace").read().split("\n")
              except OSError:
                  return None
              i = start_line - 1
              limit = min(len(lines), start_line + 2)
              while i < limit and not BEGIN.search(lines[i]):
                  i += 1
              if i >= limit:
                  return None
              body = []
              for ln in lines[i + 1:]:
                  if END.search(ln):
                      break
                  s = ln.strip()
                  if B64_LINE.match(s):
                      body.append(s)
              return "".join(body)


          def decode(b64):
              try:
                  return base64.b64decode(b64 + "=" * (-len(b64) % 4), validate=True)
              except Exception:
                  return None


          def openssh_reaches_private(raw):
              """True if the blob extends into the private section."""
              p = len(OPENSSH_MAGIC)

              def field(o):
                  if o + 4 > len(raw):
                      return None
                  n = int.from_bytes(raw[o:o + 4], "big")
                  return None if o + 4 + n > len(raw) else o + 4 + n

              for _ in range(3):                      # ciphername, kdfname, kdfoptions
                  p = field(p)
                  if p is None:
                      return False
              if p + 4 > len(raw):                    # number of keys
                  return False
              p = field(p + 4)                        # public key
              if p is None:
                  return False
              return p + 4 <= len(raw)                # any byte of the private blob


          def der_truncated_before_private(raw):
              if len(raw) < 2 or raw[0] != 0x30:
                  return False
              n = raw[1]
              if n < 0x80:
                  declared, hdr = n, 2
              else:
                  k = n & 0x7F
                  if k == 0 or 2 + k > len(raw):
                      return len(raw) < DER_MIN_PRIVATE_OFFSET
                  declared, hdr = int.from_bytes(raw[2:2 + k], "big"), 2 + k
              if hdr + declared <= len(raw):
                  return False                        # complete
              return len(raw) < DER_MIN_PRIVATE_OFFSET


          def classify(path, start_line):
              """(suppress, reason)."""
              b64 = pem_body(path, start_line)
              if b64 is None:
                  return False, "PEM block not readable — kept"
              if not b64:
                  return True, "no base64 body between the PEM markers"
              raw = decode(b64)
              if raw is None:
                  return False, "body is not valid base64 — kept"
              if raw.startswith(OPENSSH_MAGIC):
                  if openssh_reaches_private(raw):
                      return False, "complete OpenSSH key material"
                  return True, ("OpenSSH block ends after %d bytes, before the private "
                                "section begins; what is present is header and public key, "
                          "neither of them secret" % len(raw))
              if der_truncated_before_private(raw):
                  return True, "DER block truncated at %d bytes, before any private material" % len(raw)
              return False, "carries private key bytes"


          def main():
              path = sys.argv[1]
              doc = json.load(open(path))
              kept, dropped = [], []
              for r in doc.get("results", []):
                  if not r.get("check_id", "").endswith(RULE):
                      kept.append(r)
                      continue
                  suppress, why = classify(r["path"], r["start"]["line"])
                  if suppress:
                      dropped.append((r["path"], r["start"]["line"], why))
                  else:
                      kept.append(r)

              # Write the survivors back. The next step decides the exit code
              # from this file, so forgetting this would make the whole filter
              # decorative -- it would print suppressions and change nothing.
              doc["results"] = kept
              json.dump(doc, open(path, "w"))

              # Nothing is dropped quietly. Every suppression is a line in the
              # log and a row in the job summary.
              for f, line, why in dropped:
                  print(f"::notice file={f},line={line}::Not a finding: {why}")

              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a") as fh:
                      fh.write("### security-baseline / placeholder keys\n\n")
                      if dropped:
                          fh.write("| File | Line | Why it is not a finding |\n|---|---|---|\n")
                          for f, line, why in dropped:
                              fh.write(f"| `{f}` | {line} | {why} |\n")
                      else:
                          fh.write("Nothing suppressed.\n")
                      fh.write(f"\n{len(kept)} finding(s) remain.\n")

              print(f"placeholder-key filter: {len(dropped)} suppressed, {len(kept)} remain")


          if __name__ == "__main__":
              main()
          DATUM_PLACEHOLDER_FILTER
          python3 "$RUNNER_TEMP/placeholder_keys.py" "$RUNNER_TEMP/semgrep.json"

      - name: Decide the result
        run: |
          set -euo pipefail
          n=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["results"]))' \
            "$RUNNER_TEMP/semgrep.json")
          if [ "$n" -gt 0 ]; then
            echo "::error::Semgrep: $n finding(s). See the scan output above."
            exit 1
          fi
          echo "::notice::Semgrep: no findings."

      # A security gate that runs DEGRADED is the worst of the three states: it is
      # green, it did something, and what it did is not what the caller assumes.
      # Semgrep without the vendored rules runs community packs and none of ours;
      # gitleaks without a pull request base scans the working tree rather than the
      # commits under review; Trivy without `gate-on` finds real vulnerabilities
      # and blocks nothing. All three exit 0.
      - name: What this job actually did
        if: always()
        env:
          LABEL: "security-baseline / semgrep"
        run: |
          set -euo pipefail
          deg="$RUNNER_TEMP/datum-degraded.txt"
          [ -f "$deg" ] || : > "$deg"
          notes=$(paste -sd';' - < "$deg" | sed 's/;/; /g')

          {
            echo "### ${LABEL}"
            echo
            echo "| | |"
            echo "|---|---|"
            if [ -n "$notes" ]; then
              echo "| **Ran degraded** | ${notes} |"
            else
              echo "| Ran | fully configured |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$notes" ]; then
            echo "::warning::Ran degraded: ${notes}"
          fi

  secrets:
    needs: age
    if: ${{ inputs.gitleaks && needs.age.outputs.expired != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      CONFIG_DIR: ${{ inputs.config-dir }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # gitleaks reads history, so a shallow clone would scan nothing.
          fetch-depth: 0

      - name: Install the pinned gitleaks
        env:
          FALLBACK: ${{ inputs.gitleaks-version }}
        run: |
          set -euo pipefail
          p="$CONFIG_DIR/security-tool-versions.txt"
          v=""
          if [ -f "$p" ]; then
            v=$(grep '^gitleaks=' "$p" | cut -d= -f2- || true)
          fi
          if [ -n "$v" ]; then
            echo "::notice::gitleaks $v, pinned in $p."
          else
            v="$FALLBACK"
            echo "::notice::No vendored gitleaks pin, so $v is used."
          fi
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSL --fail \
            "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      - name: Scan the commits this pull request adds
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Deliberately scoped to this pull request's commits, not all history.
          # A first full-history scan on an old repo surfaces every credential
          # ever committed — all of them already needing rotation, none of them
          # this author's doing. That is a migration, and it is not the same job
          # as stopping the next one.
          if [ -z "${BASE:-}" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "::notice::No pull request base available; scanning the working tree instead."
            echo "gitleaks — scanned the working tree, not this pull request's commits" >> "$RUNNER_TEMP/datum-degraded.txt"
            gitleaks dir . --no-banner --redact --exit-code 1
            exit 0
          fi
          gitleaks git . --no-banner --redact --exit-code 1 \
            --log-opts="$BASE..$HEAD"

      # A security gate that runs DEGRADED is the worst of the three states: it is
      # green, it did something, and what it did is not what the caller assumes.
      # Semgrep without the vendored rules runs community packs and none of ours;
      # gitleaks without a pull request base scans the working tree rather than the
      # commits under review; Trivy without `gate-on` finds real vulnerabilities
      # and blocks nothing. All three exit 0.
      - name: What this job actually did
        if: always()
        env:
          LABEL: "security-baseline / secrets"
        run: |
          set -euo pipefail
          deg="$RUNNER_TEMP/datum-degraded.txt"
          [ -f "$deg" ] || : > "$deg"
          notes=$(paste -sd';' - < "$deg" | sed 's/;/; /g')

          {
            echo "### ${LABEL}"
            echo
            echo "| | |"
            echo "|---|---|"
            if [ -n "$notes" ]; then
              echo "| **Ran degraded** | ${notes} |"
            else
              echo "| Ran | fully configured |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$notes" ]; then
            echo "::warning::Ran degraded: ${notes}"
          fi

  dependencies:
    needs: age
    if: ${{ inputs.dependency-audit && needs.age.outputs.expired != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Advisories in the dependency tree
        run: |
          set -euo pipefail
          found=0
          if [ -f pnpm-lock.yaml ]; then
            corepack enable >/dev/null 2>&1 || true
            pnpm audit --audit-level=high || found=1
          fi
          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            pipx install pip-audit >/dev/null
            pip-audit --strict || found=1
          fi
          if [ "$found" = "1" ]; then
            echo "::warning::Advisories found. The fix is a Renovate bump, so this reports rather than fails."
            echo "::warning::If one is not something Renovate can raise, it needs a human — say so on the pull request."
          else
            echo "No advisories at or above high severity."
          fi
