name: self-test

# Every workflow here runs against real content before it ships, because every
# repo in the org will be downstream of this one. A bad change merged untested
# breaks the whole fleet's CI at once, not one repo's.

on:
  # `edited` is here for one reason: the title check reads the title out of the
  # event payload, and a re-run replays the ORIGINAL payload. So correcting an
  # unconventional title left the check red, showing the old title, with nothing
  # saying why -- and the only way to clear it was an unrelated push. It looked
  # like a broken gate, which is how people learn to ignore gates.
  #
  # It re-runs the whole suite on a description edit too. Free here: this
  # repository is public, so Actions minutes cost nothing. Do NOT copy this into
  # a private repo's caller without deciding that trade first.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # actionlint rather than a YAML parse. A parse cannot see a duplicated job
  # key — PyYAML silently keeps the last one — and knows nothing about Actions
  # semantics: a called workflow asking for more permissions than its caller
  # grants, an input that does not exist, a bad `needs`. Both of those shipped
  # here before this job existed, and both fail at startup with no readable log.
  lint-workflows:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: "1.7.12"
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lint every workflow
        run: |
          curl -sSL --fail \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint -version
          ./actionlint
          echo "All workflows lint clean."

  # This repo is public. The rule that makes that safe is that
  # environment-specific values arrive as inputs or org variables, never as
  # literals — and "be careful forever" is not a control, so it is checked.
  no-literal-env-values:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: No hardcoded accounts, hosts, addresses or client names
        run: python3 tests/no_literal_env_values.py .github/workflows

      # The ban is inlined in workflows-ci because a reusable workflow only
      # checks out the CALLER's repository. The test extracts it from there
      # rather than keeping a second copy, which would drift into testing
      # something the workflow does not run.
      - name: The pull_request_target ban catches it, and does not cry wolf
        run: python3 tests/test_no_pull_request_target.py

  # The placeholder-key filter DROPS security findings, so it is tested by
  # extracting the script security-baseline.yml actually ships, rather than a
  # copy kept beside it. Real keys of four formats are generated at run time and
  # must all survive; the shapes that get dropped must carry no private bytes.
  # Length is never the discriminator -- a PKCS#8 ed25519 key is 48 bytes,
  # smaller than the 52-byte truncated header this exists to suppress.
  placeholder-key-filter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: A suppressed finding must provably carry no key
        run: python3 tests/placeholder_key_filter.py

  # The YAML coverage gate audits a dbt manifest, which contains every model of
  # every installed package. It must check only THIS project's models: elementary
  # on polaris put 30 package models beside 12 of its own and produced 138
  # failures, none of them fixable by the person who hit them.
  #
  # Half these cases exist to prove the filter did not turn the gate into a
  # rubber stamp.
  dbt-yaml-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Only this project's models are audited
        run: python3 tests/dbt_yaml_coverage.py

  # Both gates ship OFF, so nothing in the fleet exercises them by default. The
  # unit cases run here regardless, and half of them prove the gate still refuses
  # -- a dashboard wired to staging, and a DECISION that is only a topic.
  analytics-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: An exposure must name a decision fork
        run: python3 tests/check_so_what.py

      - name: An exposure must read marts only
        run: python3 tests/check_one_door.py

  # sqlfluff FIXES code, so a misfiring rule does not report a false positive --
  # it edits the file and the damage ships. CP03 lowercased ClickHouse's
  # case-sensitive toDateTime on polaris, which CI could not catch because those
  # models never ran on DuckDB. Half these cases prove the two exemptions did not
  # quietly disable the rules.
  sqlfluff-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the pinned sqlfluff
        run: |
          set -euo pipefail
          # Take the pin verbatim from the requirements file rather than parsing a
          # version out of it -- dbt-tool-versions.txt is pip format (name==x.y.z),
          # and splitting on '=' silently yields an empty version.
          pin=$(grep '^sqlfluff==' configs/dbt-tool-versions.txt)
          if [ -z "$pin" ]; then
            echo "::error::No sqlfluff== pin in configs/dbt-tool-versions.txt."
            exit 1
          fi
          python3 -m venv .sqvenv
          .sqvenv/bin/pip install --quiet --disable-pip-version-check "$pin"
          # The test skips when sqlfluff is missing, which would be a silent pass
          # here. Make the install prove itself instead.
          .sqvenv/bin/python -m sqlfluff --version

      - name: The exemptions are scoped, and the rules still bite
        run: .sqvenv/bin/python tests/sqlfluff_config.py

  # A release stops scanning after a year. Two properties matter more than the
  # expiry: it must PASS rather than fail (breaking a former client's CI from
  # outside is not ours to do), and it must FAIL OPEN (an unreadable stamp is a
  # bug in our release process, never a reason to stop scanning their code).
  release-expiry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Expiry passes, never fails, and fails open
        run: python3 tests/release_expiry.py

  # docs-ci run against this repo, with every optional check switched on, so a
  # change to any of them is exercised here first.
  docs-ci:
    uses: ./.github/workflows/docs-ci.yml
    with:
      placeholder-paths: "docs/"
      # Scanned against fixtures, not against this repo's own docs. Those docs
      # quote the denylist to explain the input, and the vocabulary check
      # deliberately reads code as well as prose — a retired identifier in an
      # example is a real occurrence. The fixtures exercise both the denylist
      # and the allowlist without that collision.
      vocabulary-denylist: "catalog block|BlockManifest|decision product|Datum Services Standard"
      vocabulary-scan-paths: "tests/fixtures/vocabulary/"
      vocabulary-allow-files: "rename-history.md"

  # python-ci run against a fixture project that carries the vendored configs
  # exactly as a scaffolded repo would. If a change to configs/ would break
  # every Python repo in the org, it breaks here first.
  python-ci:
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: tests/fixtures/python-ok

  # dbt-ci run against a fixture project on duckdb, so `dbt build` and the
  # contract check are genuinely exercised with no warehouse and no
  # credentials. A change to the shared sqlfluff config or the coverage script
  # breaks here before it reaches an install.
  dbt-ci:
    uses: ./.github/workflows/dbt-ci.yml
    with:
      working-directory: tests/fixtures/dbt-ok
      # These two ship OFF so no install gains a gate it did not ask for. They
      # are turned on HERE so the fixture proves they work against a real
      # manifest — a gate that never runs anywhere is not a gate.
      so-what: true
      one-door: true

  # commit-lint against this pull request's own title. It runs on the real thing
  # rather than a fixture, which is the only way to know the event wiring works.
  commit-lint:
    uses: ./.github/workflows/commit-lint.yml

  # release in dry-run: the version derivation runs against this repo's real
  # history on every pull request, so a change to it cannot ship untested.
  # Nothing is tagged and nothing is published, so self-test's read-only token
  # is enough — and this job is what catches a permissions regression in
  # release.yml, because asking for more than the caller grants fails at
  # startup rather than in a step.
  release-dry-run:
    uses: ./.github/workflows/release.yml
    with:
      dry-run: true

  # gitops-ci against a real Flux tree: kustomize renders offline and kubeconform
  # validates the result, so every gate runs with no cluster and no credentials.
  gitops-ci:
    uses: ./.github/workflows/gitops-ci.yml
    with:
      root: tests/fixtures/gitops-ok

  # changed-paths against this repo's own history on every pull request. The
  # folders are real ones here, so the git diff runs against real commits rather
  # than a fixture — the only way to know the base-commit wiring works for both
  # a pull request and a push.
  changed-paths:
    uses: ./.github/workflows/changed-paths.yml
    with:
      paths: "configs tests docs"
      run-all-on: ".github/workflows/changed-paths.yml"

  # A reusable workflow's outputs are easy to break silently: a typo in the
  # `value:` expression yields an empty string, not an error, and every caller's
  # `if:` then evaluates false and skips every gate. This asserts the output
  # actually arrives.
  changed-paths-outputs:
    needs: changed-paths
    runs-on: ubuntu-latest
    steps:
      - name: The outputs are populated
        env:
          CHANGED: ${{ needs.changed-paths.outputs.changed }}
          ANY: ${{ needs.changed-paths.outputs.any }}
        run: |
          set -euo pipefail
          echo "changed='$CHANGED' any='$ANY'"

          case "$ANY" in
            true|false) ;;
            *) echo "::error::'any' output is '$ANY', expected true or false"; exit 1 ;;
          esac

          # `changed` may legitimately be empty — a pull request touching none of
          # the three folders and not tripping run-all-on. What must never
          # happen is `any=true` with nothing named, or a folder named that was
          # not asked for.
          if [ "$ANY" = "true" ] && [ -z "$CHANGED" ]; then
            echo "::error::any=true but no folder was named"
            exit 1
          fi
          for folder in $CHANGED; do
            case "$folder" in
              configs|tests|docs) ;;
              *) echo "::error::named '$folder', which was not in the input"; exit 1 ;;
            esac
          done
          echo "changed-paths outputs are well-formed."

  # web-ci against a real React + Vite fixture carrying the vendored configs
  # exactly as a scaffolded repo would: biome, tsc, vitest with coverage, and a
  # real build. A change to configs/biome.json or the pinned versions breaks here
  # before it reaches a front end.
  web-ci:
    uses: ./.github/workflows/web-ci.yml
    with:
      working-directory: tests/fixtures/web-ok

  # The §11 phase-in is the one piece of logic in web-ci that a passing fixture
  # cannot exercise: the fixture is at 100%, so the below-threshold branch never
  # runs. This drives it directly — a draft repo under the threshold must warn
  # and pass, and a production repo under it must fail. Getting this backwards
  # either blocks every draft repo or silently exempts production.
  web-coverage-phase-in:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Draft under threshold warns; production under threshold fails
        run: |
          set -euo pipefail

          gate() {
            local pct="$1" phase="$2" threshold="$3"
            local below
            below=$(node -e "process.stdout.write(($pct < $threshold) ? 'yes' : 'no')")
            if [ "$below" = "yes" ] && [ "$phase" = "production" ]; then
              return 1
            fi
            return 0
          }

          fail=0
          expect() { # $1=expected(pass|block) $2=pct $3=phase $4=threshold
            if gate "$2" "$3" "$4"; then got=pass; else got=block; fi
            if [ "$got" != "$1" ]; then
              echo "::error::pct=$2 phase=$3 threshold=$4 -> $got, expected $1"
              fail=1
            else
              echo "  ok: pct=$2 phase=$3 -> $got"
            fi
          }

          expect pass  100  draft      80
          expect pass  100  production 80
          expect pass  42   draft      80
          expect block 42   production 80
          expect pass  80   production 80
          expect block 79.9 production 80
          expect pass  0    draft      80
          expect block 0    production 80

          [ "$fail" -eq 0 ] || exit 1
          echo "Coverage phase-in behaves correctly in both phases (DES §11)."

  # The §11 quarantine gate, proven on fixtures rather than asserted.
  #
  # §12 lists "No disabled test past its fix-or-delete date" as CI-enforced and
  # nothing enforced it, so a quarantined test could sit disabled forever — the
  # exact failure the rule exists to prevent, arrived at slowly.
  #
  # The third case is the one that matters. A conditional skip is not a
  # quarantine: skipif/importorskip/runIf say "this test does not apply here",
  # which is a permanent statement about the environment, not a test nobody is
  # watching. A gate that flags every platform guard gets switched off in a week.
  quarantine-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Owned and in date, plus conditional skips, all pass
        run: |
          set -euo pipefail
          python3 configs/no-stale-quarantine.py tests/fixtures/quarantine-ok

      - name: A skip with no owner or date fails
        run: |
          set -euo pipefail
          if python3 configs/no-stale-quarantine.py tests/fixtures/quarantine-unowned; then
            echo "::error::An unowned quarantine was accepted. The gate does not work."
            exit 1
          fi
          echo "Correctly rejected."

      - name: A quarantine past its date fails
        run: |
          set -euo pipefail
          if python3 configs/no-stale-quarantine.py tests/fixtures/quarantine-expired; then
            echo "::error::An expired quarantine was accepted. The gate does not work."
            exit 1
          fi
          echo "Correctly rejected."

      - name: The checker does not flag its own documented examples
        run: |
          set -euo pipefail
          python3 configs/no-stale-quarantine.py configs/no-stale-quarantine.py

  # renovate.yml in dry-run, so the engine, the pinned version and the org preset
  # are all exercised on every pull request — without a token and without opening
  # anything anywhere.
  #
  # The failure this catches is the quiet one: a Renovate major that renames a
  # config field does not error, it just finds nothing to update, which is
  # indistinguishable from "everything is current". Validating the preset at the
  # pinned version is the only thing that tells them apart.
  renovate-dry-run:
    uses: ./.github/workflows/renovate.yml
    with:
      dry-run: true
      # Deliberately matches nothing. The point is to exercise the preset
      # validation and the engine's startup, not to scan the org on every PR.
      autodiscover-filter: "datumlabsio/__no_such_repo__"
    secrets:
      # Deliberately empty. This repo holds no App credentials, so the run
      # exercises the missing-credentials guard and exits green — which is the
      # branch a scheduled run takes before B-06 lands, and the one most likely
      # to rot unnoticed.
      app-id: ""
      private-key: ""

  # workflows-ci on this repo. Positive case: everything here must be clean.
  workflows-ci:
    uses: ./.github/workflows/workflows-ci.yml

  # And the negative case, because a gate nobody has watched refuse anything is
  # a gate you hope works.
  #
  # This cannot be a `uses:` job — actionlint correctly points out that
  # continue-on-error is not available on one, so a job that is SUPPOSED to fail
  # would just fail the run. Instead it lifts the checker out of workflows-ci.yml
  # and runs that exact source against a fixture, so there is no second copy to
  # drift.
  #
  # The fixture is broken two ways at once: a version that does not exist, and an
  # input that workflow never declared.
  workflows-ci-blocks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: The pin check refuses an unresolvable pin
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'EXTRACT'
          import pathlib, re, sys

          src = pathlib.Path(".github/workflows/workflows-ci.yml").read_text()
          m = re.search(r"python3 - <<'PY'\n(.*?)\n          PY\n", src, re.S)
          if not m:
              sys.exit("could not lift the pin checker out of workflows-ci.yml")
          body = "\n".join(
              line[10:] if line.startswith(" " * 10) else line
              for line in m.group(1).split("\n")
          )
          pathlib.Path("/tmp/pin_check.py").write_text(body)
          print(f"lifted {len(body.splitlines())} lines")
          EXTRACT
          cd tests/fixtures/pins-bad
          if python3 /tmp/pin_check.py; then
            echo "::error::workflows-ci accepted a pin to a version that does not exist."
            echo "::error::The gate does not block, which is worse than not having it."
            exit 1
          fi
          echo "Correctly refused."

  # THE ARCHETYPE WRAPPERS. Until now self-test only exercised the -ci workflows
  # underneath them, so the four files every downstream repo actually names had
  # no coverage at all — on any event.
  #
  # That is how this shipped for nine releases: each wrapper guarded its
  # commit-lint call with `if: … github.event_name == 'pull_request'`, which
  # SKIPS the job on a push. A skipped job holding a relative reference inside a
  # workflow called from another repository cannot be resolved, and the run dies
  # at startup with no jobs and no log. Pull request checks stayed green, so
  # every repo built from a scaffold had a permanently red default branch that
  # nobody was looking at.
  #
  # These run on both events, because self-test triggers on pull_request and on
  # push to main. That is the whole point: the push path is the one that broke.
  docs-wrapper:
    uses: ./.github/workflows/docs.yml
    with:
      placeholder-paths: "docs/"
      vocabulary-scan-paths: "tests/fixtures/vocabulary/"
      vocabulary-allow-files: "rename-history.md"

  # commit-lint: false is the case the old `if:` was written for. It has to work
  # without skipping the job, or the fix has just moved the bug.
  docs-wrapper-no-commitlint:
    uses: ./.github/workflows/docs.yml
    with:
      commit-lint: false
      placeholder-paths: "docs/"
      vocabulary-scan-paths: "tests/fixtures/vocabulary/"
      vocabulary-allow-files: "rename-history.md"

  dbt-project-wrapper:
    uses: ./.github/workflows/dbt-project.yml
    with:
      working-directory: tests/fixtures/dbt-ok

  web-app-wrapper:
    uses: ./.github/workflows/web-app.yml
    with:
      working-directory: tests/fixtures/web-ok

  dlt-pipeline-wrapper:
    uses: ./.github/workflows/dlt-pipeline.yml
    with:
      working-directory: tests/fixtures/python-ok

  # security-baseline against fixtures, because a scanner nobody has watched
  # refuse anything is a scanner you hope works.
  # The reusable workflow itself, called end to end against a fixture whose only
  # Semgrep finding is a private-key match carrying no private key. It must pass.
  #
  # The job above scans fixtures with Semgrep directly, which never exercises the
  # filter or the exit-code decision that follows it. Without this, a broken
  # filter ships green: the placeholder rule would be tested only by a unit test
  # of a script nothing had been observed running.
  #
  # The fixture is NOT under tests/ because Semgrep's default ignore list
  # excludes tests/ -- kept there, this job reported "Ran 1077 rules on 0 files"
  # and passed while scanning nothing.
  security-baseline-placeholder-key:
    uses: ./.github/workflows/security-baseline.yml
    with:
      working-directory: fixtures-scanned
      gitleaks: false
      dependency-audit: false

  security-baseline:
    runs-on: ubuntu-latest
    env:
      SG: ${{ github.workspace }}/.sgvenv/bin/semgrep
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the pinned Semgrep
        run: |
          set -euo pipefail
          v=$(grep '^semgrep=' configs/security-tool-versions.txt | cut -d= -f2)
          python3 -m venv .sgvenv
          .sgvenv/bin/pip install --quiet --disable-pip-version-check "semgrep==$v"
          "$SG" --version

      - name: The vulnerable fixture is refused, and every Datum rule fires
        working-directory: tests/fixtures/security-bad
        run: |
          set -euo pipefail
          if "$SG" scan --config=semgrep.yml --error --metrics=off \
               --disable-version-check vulnerable.py > /tmp/out.txt 2>&1; then
            echo "::error::Semgrep accepted the deliberately vulnerable fixture."
            cat /tmp/out.txt
            exit 1
          fi
          for rule in datum-subprocess-shell-true datum-bare-except datum-retired-vocabulary; do
            if ! grep -q "$rule" /tmp/out.txt; then
              echo "::error::$rule did not fire. A rule that never matches is worse than no rule."
              cat /tmp/out.txt
              exit 1
            fi
          done
          echo "Refused, and all three rules fired."

      - name: The clean fixture passes untouched
        working-directory: tests/fixtures/security-ok
        run: |
          set -euo pipefail
          "$SG" scan --config=semgrep.yml --error --metrics=off \
            --disable-version-check clean.py
          echo "Clean fixture passes."

      # The secret is generated at runtime and never committed. This repo is
      # PUBLIC with push protection on, so a realistic-looking credential in a
      # fixture would be refused at push time — correctly. Generating it here
      # tests gitleaks without ever putting one in the history.
      - name: gitleaks refuses a planted secret
        run: |
          set -euo pipefail
          v=$(grep '^gitleaks=' configs/security-tool-versions.txt | cut -d= -f2)
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/leak"
          curl -sSL --fail \
            "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/bin" gitleaks
          "$RUNNER_TEMP/bin/gitleaks" version

          printf 'aws_secret_access_key = "%s"\n' \
            "$(head -c 30 /dev/urandom | base64 | tr -d '/+=' | head -c 40)" \
            > "$RUNNER_TEMP/leak/config.txt"

          if "$RUNNER_TEMP/bin/gitleaks" dir "$RUNNER_TEMP/leak" \
               --no-banner --redact --exit-code 1; then
            echo "::error::gitleaks accepted a planted credential."
            exit 1
          fi
          echo "Correctly refused."

      - name: gitleaks passes a clean tree
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clean"
          echo "nothing to see here" > "$RUNNER_TEMP/clean/notes.txt"
          "$RUNNER_TEMP/bin/gitleaks" dir "$RUNNER_TEMP/clean" --no-banner --redact --exit-code 1
          echo "Clean tree passes."

  # container-ci against fixtures. publish stays false — self-test must never
  # push an image, and a pull request from a fork must never be able to.
  container-ci:
    uses: ./.github/workflows/container-ci.yml
    # packages: write is granted even though publish is false and the publish job
    # never runs. A called workflow cannot request more permission than its
    # caller holds, and that is checked at STARTUP — before any `if:` is
    # evaluated, so a job that will be skipped still has to be grantable. Without
    # this the whole run dies as startup_failure with no log, which is exactly
    # how B-41 broke main.
    permissions:
      contents: read
      packages: write
    with:
      working-directory: tests/fixtures/container-ok

  # And the negative case. hadolint has to refuse the bad Dockerfile, so this
  # runs it directly rather than through the workflow — a `uses:` job cannot be
  # continue-on-error, so a job meant to fail would just fail the run.
  container-ci-blocks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: hadolint refuses the bad Dockerfile
        run: |
          set -euo pipefail
          v=$(grep '^hadolint=' configs/container-tool-versions.txt | cut -d= -f2)
          curl -sSL --fail -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${v}/hadolint-linux-x86_64"
          chmod +x /tmp/hadolint
          if /tmp/hadolint tests/fixtures/container-bad/Dockerfile; then
            echo "::error::hadolint accepted a Dockerfile using :latest, unpinned packages and a shell-form CMD."
            exit 1
          fi
          echo "Correctly refused."

      - name: And accepts the clean one
        run: |
          set -euo pipefail
          /tmp/hadolint tests/fixtures/container-ok/Dockerfile
          echo "Clean Dockerfile passes."

  # The application wrapper, against the python fixture. Proves the wrapper
  # resolves and that coverage reporting does not break a repo that has tests.
  application-wrapper:
    uses: ./.github/workflows/application.yml
    with:
      working-directory: tests/fixtures/python-ok
      config-dir: .

  # The §11 phase-in for Python, driven directly. A passing fixture cannot
  # exercise the below-threshold branch, and getting this backwards either blocks
  # every draft repo or silently exempts production — the same trap web-ci had.
  python-coverage-phase-in:
    runs-on: ubuntu-latest
    steps:
      - name: A draft repo under the threshold warns and passes
        env:
          PHASE: draft
          THRESHOLD: "80"
        run: |
          set -euo pipefail
          pct=41.2
          if python3 -c "import sys;sys.exit(0 if float('${pct}') < float('${THRESHOLD}') else 1)"; then
            if [ "$PHASE" = "production" ]; then echo "wrong branch"; exit 1; fi
            echo "Correctly warned rather than failed."
          else
            echo "::error::below-threshold was not detected"; exit 1
          fi

      - name: A production repo under the threshold fails
        env:
          PHASE: production
          THRESHOLD: "80"
        run: |
          set -euo pipefail
          pct=41.2
          if python3 -c "import sys;sys.exit(0 if float('${pct}') < float('${THRESHOLD}') else 1)"; then
            if [ "$PHASE" = "production" ]; then
              echo "Correctly identified as blocking."
              exit 0
            fi
          fi
          echo "::error::production below threshold did not block"; exit 1

  # The audit runs against this repo and scaffolds on every pull request, in
  # dry-run. It proves the checks execute and the script parses — it does NOT
  # assert conformance, because both repos legitimately have findings: neither
  # was born from a scaffold, and `actions` is the callee rather than a caller.
  #
  # Asserting zero findings here would mean either weakening the audit until it
  # passes, or exempting the repos it lives in. Both are worse than an honest
  # report.
  conformance-audit:
    uses: ./.github/workflows/conformance-audit.yml
    with:
      repos: "datumlabsio/actions datumlabsio/scaffolds"
      dry-run: true
    secrets:
      # Empty on purpose, so the missing-credentials branch is the one exercised
      # on every pull request — the branch a scheduled run takes before the
      # secrets exist, and the one most likely to rot unnoticed.
      app-id: ""
      private-key: ""

  # The reusable-paths check, both directions. It shipped flagging standard
  # Kubernetes label keys and Helm chart repository URLs — content the scaffold
  # itself generates — so a repo could fail this before anyone wrote a line.
  reusable-paths-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Lifted from gitops-ci at runtime so there is no second copy. The gate
      # is a Python script now, not a grep — it parses the YAML rather than
      # pattern-matching it, which is why RBAC `apiGroups` and CRD API groups
      # stopped being findings without an exclusion being added for either.
      - name: Lift the checker out of gitops-ci, so there is no second copy
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'EX'
          import pathlib, sys
          src = pathlib.Path(".github/workflows/gitops-ci.yml").read_text()
          marker = "- name: Reusable paths name no install"
          if marker not in src:
              sys.exit("could not find the reusable-paths step in gitops-ci.yml")
          blk = src.split(marker, 1)[1]
          if "python3 - <<'PY'" not in blk:
              sys.exit("the reusable-paths step is no longer a python block; this test needs updating")
          body = blk.split("python3 - <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0]
          code = "\n".join(l[10:] if l.startswith(" " * 10) else l for l in body.splitlines())
          pathlib.Path("/tmp/reusable.py").write_text(code)
          EX

      - name: Kubernetes labels and chart repositories are not findings
        working-directory: tests/fixtures/gitops-ok
        env:
          PATHS: "policies charts"
        run: |
          set -euo pipefail
          if ! python3 /tmp/reusable.py; then
            echo "::error::Flagged content the scaffold itself generates."
            exit 1
          fi
          echo "Standard label keys and chart repository URLs pass."

      # The control case. A checker that passes everything passes this fixture
      # too, and the rewrite from grep to a parser is exactly the change most
      # likely to loosen it by accident.
      - name: An install hostname is still refused
        working-directory: tests/fixtures/gitops-install-leak
        env:
          PATHS: "platform"
        run: |
          set -euo pipefail
          out=$(python3 /tmp/reusable.py || true)
          printf '%s\n' "$out"
          if ! printf '%s' "$out" | grep -q 'acme-corp'; then
            echo "::error::The check no longer catches a real install hostname. It has been loosened too far."
            exit 1
          fi
          echo "Correctly refused."

      # RBAC apiGroups and a CRD's API group are our own domain in a position
      # where it is not a hostname. These were findings until the gate parsed
      # YAML, and they are the reason it now does.
      - name: Our own domain as an API group is not a finding
        env:
          PATHS: "probe"
        run: |
          set -euo pipefail
          mkdir -p probe
          cat > probe/rbac.yaml <<'YAML'
          rules:
            - apiGroups: [platform.example.test]
              resources: [applicationmanifests]
          ---
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: applicationmanifests.platform.example.test
          spec:
            group: platform.example.test
          YAML
          if ! python3 /tmp/reusable.py; then
            echo "::error::An API group was read as a hostname. This is the bug the parser exists to remove."
            exit 1
          fi
          echo "API groups are not hostnames."

  # B-19. Two gitops gates had never been watched refusing anything: the image
  # pinning check and the plaintext-secret check. Both are hand-written greps,
  # which is exactly the kind that stops matching without anyone noticing — a
  # regex that silently matches nothing is indistinguishable from a clean repo.
  #
  # Both directions are asserted. A gate tested only against broken input looks
  # like it works even when it refuses everything, so the control case — a
  # correct fixture that must PASS — is the half that catches over-matching.
  #
  # The bad fixtures are written at run time rather than committed. The same
  # reasoning as the gitleaks test above: a repository that scans itself should
  # not carry secret-shaped content in its own history.
  gitops-gates-block:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lift both checkers out of gitops-ci, so there is no second copy
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'EX'
          import pathlib, sys, yaml

          doc = yaml.safe_load(pathlib.Path(".github/workflows/gitops-ci.yml").read_text())
          steps = doc["jobs"][next(iter(doc["jobs"]))]["steps"]
          wanted = {"Images are pinned": "/tmp/pin.sh", "No plaintext secrets": "/tmp/sec.sh"}
          found = {}
          for step in steps:
              target = wanted.get(step.get("name"))
              if target:
                  body = step["run"]
                  # Built in two pieces so this file never contains the literal
                  # expression opener, which GitHub would try to evaluate here.
                  if "$" + "{{" in body:
                      sys.exit(f"{step['name']} now uses a workflow expression; it can no longer be lifted verbatim")
                  pathlib.Path(target).write_text("#!/usr/bin/env bash\n" + body)
                  found[step["name"]] = target
          missing = set(wanted) - set(found)
          if missing:
              sys.exit(f"could not find these steps in gitops-ci.yml: {sorted(missing)}")
          print(f"lifted {len(found)} checkers")
          EX
          chmod +x /tmp/pin.sh /tmp/sec.sh

      - name: Write the fixtures
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP"/{ok,unpinned,plaintext}

          cat > "$RUNNER_TEMP/ok/deployment.yaml" <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: pinned
          spec:
            template:
              spec:
                containers:
                  - name: app
                    image: ghcr.io/datumlabsio/app:1.4.2
          EOF

          cat > "$RUNNER_TEMP/unpinned/deployment.yaml" <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: floating
          spec:
            template:
              spec:
                containers:
                  - name: app
                    image: nginx:latest
                  - name: sidecar
                    image: busybox
          EOF

          cat > "$RUNNER_TEMP/plaintext/secret.yaml" <<'EOF'
          apiVersion: v1
          kind: Secret
          metadata:
            name: inline
          type: Opaque
          stringData:
            connection: postgres://user@host/db
          EOF

      - name: The control passes both gates
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ok"
          if ! bash /tmp/pin.sh; then
            echo "::error::The image-pinning gate rejected a correctly pinned image. It over-matches."
            exit 1
          fi
          if ! bash /tmp/sec.sh; then
            echo "::error::The plaintext-secret gate rejected a manifest with no Secret in it. It over-matches."
            exit 1
          fi
          echo "A correct manifest passes both."

      - name: An unpinned image is refused
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/unpinned"
          if bash /tmp/pin.sh; then
            echo "::error:::latest and an untagged image were both accepted."
            echo "::error::The gate does not block, which is worse than not having it."
            exit 1
          fi
          echo "Correctly refused."

      - name: A Secret with inline data is refused
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/plaintext"
          if bash /tmp/sec.sh; then
            echo "::error::A Secret carrying stringData was accepted. DES §6 has no exceptions."
            exit 1
          fi
          echo "Correctly refused."

  # B-19, second slice. Four docs gates had never been watched refusing anything.
  #
  # `proposal-status` is the one that matters most: it catches a proposal merged
  # while still `Status: Draft`, which was missed three times by hand before this
  # gate existed. It is also the gate that skips itself when there is no base
  # commit, so it has two ways to quietly do nothing.
  #
  # Every gate is asserted in BOTH directions. A gate tested only against broken
  # input looks like it works even when it refuses everything — the control case
  # is the half that catches over-matching, and the vocabulary allowlist is
  # exactly where that could bite.
  docs-gates-block:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lift the four checkers out of docs-ci, so there is no second copy
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'EX'
          import pathlib, re, sys, yaml

          doc = yaml.safe_load(pathlib.Path(".github/workflows/docs-ci.yml").read_text())
          steps = doc["jobs"][next(iter(doc["jobs"]))]["steps"]
          targets = {
              "No conflict markers": "/tmp/conflict.sh",
              "No placeholder rot": "/tmp/placeholder.sh",
              "No retired vocabulary": "/tmp/vocab.sh",
              "Proposal status matches what shipped": "/tmp/status.sh",
          }
          found = {}
          for step in steps:
              target = targets.get(step.get("name"))
              if not target:
                  continue
              body = step["run"]
              # The vocabulary step interpolates its scan paths; take them as
              # positional arguments instead so the body can run standalone.
              body = re.sub(r"\$\{\{\s*inputs\.vocabulary-scan-paths\s*\}\}", '"$@"', body)
              if "$" + "{{" in body:
                  sys.exit(f"{step['name']} uses a workflow expression that cannot be lifted")
              pathlib.Path(target).write_text("#!/usr/bin/env bash\nset -uo pipefail\n" + body)
              found[step["name"]] = target
          missing = set(targets) - set(found)
          if missing:
              sys.exit(f"could not find these steps in docs-ci.yml: {sorted(missing)}")
          print(f"lifted {len(found)} checkers")
          EX
          chmod +x /tmp/conflict.sh /tmp/placeholder.sh /tmp/vocab.sh /tmp/status.sh

      - name: Conflict markers — clean passes, markers are refused
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clean" && printf 'nothing wrong here\n' > "$RUNNER_TEMP/clean/a.md"
          if ! (cd "$RUNNER_TEMP/clean" && bash /tmp/conflict.sh); then
            echo "::error::The conflict-marker gate rejected a clean file. It over-matches."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/dirty"
          printf '<<<<<<< HEAD\nmine\n>>>>>>> theirs\n' > "$RUNNER_TEMP/dirty/a.md"
          if (cd "$RUNNER_TEMP/dirty" && bash /tmp/conflict.sh); then
            echo "::error::Conflict markers were accepted in a merged file."
            exit 1
          fi
          echo "Correctly refused."

      - name: Placeholder rot — clean passes, a TODO is refused
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p-ok/standards" && printf 'the spec says what it does\n' > "$RUNNER_TEMP/p-ok/standards/a.md"
          if ! (cd "$RUNNER_TEMP/p-ok" && PATHS=standards bash /tmp/placeholder.sh); then
            echo "::error::The placeholder gate rejected a file with no placeholder in it. It over-matches."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/p-bad/standards" && printf 'TODO: decide this later\n' > "$RUNNER_TEMP/p-bad/standards/a.md"
          if (cd "$RUNNER_TEMP/p-bad" && PATHS=standards bash /tmp/placeholder.sh); then
            echo "::error::A TODO was accepted under standards/. The specs are the present tense."
            exit 1
          fi
          echo "Correctly refused."

      - name: Retired vocabulary — clean passes, a retired term is refused, the allowlist still works
        env:
          DENYLIST: 'catalog block|BlockManifest|decision product'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v-ok/standards" && printf 'An application has a my-apps tile.\n' > "$RUNNER_TEMP/v-ok/standards/a.md"
          if ! (cd "$RUNNER_TEMP/v-ok" && ALLOW='' bash /tmp/vocab.sh standards); then
            echo "::error::The vocabulary gate rejected current vocabulary. It over-matches."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/v-bad/standards" && printf 'Register a catalog block.\n' > "$RUNNER_TEMP/v-bad/standards/a.md"
          if (cd "$RUNNER_TEMP/v-bad" && ALLOW='' bash /tmp/vocab.sh standards); then
            echo "::error::A retired RFC-0008 term was accepted outside the allowlist."
            exit 1
          fi
          # The historical paths accepted RFCs link to must stay exempt, or this
          # gate starts failing on files nobody is allowed to rename.
          mkdir -p "$RUNNER_TEMP/v-allow/standards" && printf 'A catalog block, historical.\n' > "$RUNNER_TEMP/v-allow/standards/architecture.md"
          if ! (cd "$RUNNER_TEMP/v-allow" && ALLOW='architecture\.md' bash /tmp/vocab.sh standards); then
            echo "::error::The allowlist no longer exempts a historical path."
            exit 1
          fi
          echo "Correctly refused, and the allowlist still holds."

      - name: Proposal status — a Draft shipped alongside a spec change is refused
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/statusrepo"
          mkdir -p "$repo/rfcs" "$repo/standards"
          cd "$repo"
          git init -q
          git config user.email selftest@datumlabs.io
          git config user.name self-test
          printf 'the spec\n' > standards/README.md
          printf '# Existing\n- **Status:** Accepted\n' > rfcs/0001-existing.md
          git add -A && git commit -qm base
          base=$(git rev-parse HEAD)

          # A proposal and a spec change in the same pull request, still Draft.
          printf '# New\n- **Status:** Draft\n' > rfcs/0099-new.md
          printf 'changed\n' >> standards/README.md
          git add -A && git commit -qm "propose and ship together"
          if BASE="$base" RFC_DIR=rfcs SPEC_DIR=standards bash /tmp/status.sh; then
            echo "::error::A proposal left at Status: Draft shipped alongside a spec change."
            echo "::error::This is the miss that happened three times by hand; the gate does not block it."
            exit 1
          fi
          echo "Correctly refused."

          # Control: the same pull request with the status flipped must pass.
          printf '# New\n- **Status:** Accepted\n' > rfcs/0099-new.md
          git add -A && git commit -qm "flip on the merging pull request"
          if ! BASE="$base" RFC_DIR=rfcs SPEC_DIR=standards bash /tmp/status.sh; then
            echo "::error::The gate rejected a proposal that WAS flipped to Accepted. It over-matches."
            exit 1
          fi
          echo "A flipped proposal passes."

          # And the case that used to pass silently. A base commit that is not in
          # the checkout means the gate cannot see what changed; it must say so
          # rather than report success it did not earn.
          if BASE=0000000000000000000000000000000000000000 RFC_DIR=rfcs SPEC_DIR=standards bash /tmp/status.sh; then
            echo "::error::A missing base commit was treated as a pass. The gate reported success without checking anything."
            exit 1
          fi
          echo "A missing base commit fails loudly."

  # B-19, last slice. The two remaining gates nobody had watched refuse.
  #
  # dbt YAML coverage is a vendored script, so it is driven directly against
  # synthesised manifests — one per rule it enforces. Writing those fixtures is
  # what found the fifth rule: a mart must enforce a contract. A "good" manifest
  # built from the docstring alone was refused, which is precisely what the
  # control case exists to catch.
  #
  # commit-lint is lifted out of its workflow like the others.
  remaining-gates-block:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: dbt YAML coverage refuses each violation, and accepts a clean manifest
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/manifests"
          mkdir -p "$d"

          # package_name and metadata.project_name are what separate this
          # project's models from those of an installed package. Without them the
          # gate refuses to guess, so every fixture carries both.
          meta='"metadata":{"project_name":"p"}'
          model='"resource_type":"model","name":"orders","package_name":"p","original_file_path":"models/marts/orders.sql","fqn":["p","marts","orders"]'
          contract='"config":{"contract":{"enforced":true}}'
          test_node='"test.p.nn":{"resource_type":"test","depends_on":{"nodes":["model.p.orders"]}}'
          cols_ok='"columns":{"order_id":{"description":"Primary key."}}'
          patch='"patch_path":"p://models/schema.yml"'
          desc='"description":"One row per order."'

          printf '{%s,"nodes":{"model.p.orders":{%s,%s,%s,%s,%s},%s}}\n' \
            "$meta" "$model" "$contract" "$patch" "$desc" "$cols_ok" "$test_node" > "$d/good.json"
          printf '{%s,"nodes":{"model.p.orders":{%s,%s,%s,"description":"",%s},%s}}\n' \
            "$meta" "$model" "$contract" "$patch" "$cols_ok" "$test_node" > "$d/no-description.json"
          printf '{%s,"nodes":{"model.p.orders":{%s,%s,%s,%s},%s}}\n' \
            "$meta" "$model" "$contract" "$desc" "$cols_ok" "$test_node" > "$d/no-yaml-entry.json"
          printf '{%s,"nodes":{"model.p.orders":{%s,%s,%s,%s,%s}}}\n' \
            "$meta" "$model" "$contract" "$patch" "$desc" "$cols_ok" > "$d/untested.json"
          printf '{%s,"nodes":{"model.p.orders":{%s,%s,%s,%s,"columns":{"order_id":{"description":""}}},%s}}\n' \
            "$meta" "$model" "$contract" "$patch" "$desc" "$test_node" > "$d/undocumented-column.json"
          printf '{%s,"nodes":{"model.p.orders":{%s,%s,%s,%s},%s}}\n' \
            "$meta" "$model" "$patch" "$desc" "$cols_ok" "$test_node" > "$d/no-contract.json"

          # The control first. A gate that refuses everything looks identical to a
          # working one until somebody tries to merge something legitimate.
          if ! python3 configs/dbt-yaml-coverage.py --manifest "$d/good.json" --mart-path marts; then
            echo "::error::A fully documented, tested, contracted mart was refused. The gate over-matches."
            exit 1
          fi
          echo "A clean manifest passes."

          for case in no-description no-yaml-entry untested undocumented-column no-contract; do
            if python3 configs/dbt-yaml-coverage.py --manifest "$d/$case.json" --mart-path marts; then
              echo "::error::dbt YAML coverage accepted '$case'. The gate does not block it."
              exit 1
            fi
            echo "  refused: $case"
          done
          # An installed package's models must be invisible. This is what
          # elementary tripped on polaris: 30 package models beside 12 of its own,
          # 138 failures, none of them the author's to fix.
          pkg='"resource_type":"model","name":"alerts","package_name":"elementary","original_file_path":"models/edr/alerts.sql","fqn":["elementary","alerts"]'
          printf '{%s,"nodes":{"model.p.orders":{%s,%s,%s,%s,%s},"model.elementary.alerts":{%s},%s}}\n' \
            "$meta" "$model" "$contract" "$patch" "$desc" "$cols_ok" "$pkg" "$test_node" > "$d/with-package.json"
          if ! python3 configs/dbt-yaml-coverage.py --manifest "$d/with-package.json" --mart-path marts; then
            echo "::error::An installed package's undocumented models were reported. They are not the author's to fix."
            exit 1
          fi
          echo "  package models ignored, own models still checked."

          echo "Every rule in dbt.md §2 was watched refusing."

      - name: commit-lint refuses a title that is not a Conventional Commit
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'EX'
          import pathlib, sys, yaml

          doc = yaml.safe_load(pathlib.Path(".github/workflows/commit-lint.yml").read_text())
          steps = doc["jobs"][next(iter(doc["jobs"]))]["steps"]
          for step in steps:
              if step.get("name") == "Title is a Conventional Commit":
                  body = step["run"]
                  if "$" + "{{" in body:
                      sys.exit("commit-lint now uses a workflow expression; it can no longer be lifted")
                  pathlib.Path("/tmp/cl.sh").write_text("#!/usr/bin/env bash\nset -uo pipefail\n" + body)
                  print("lifted the title checker")
                  break
          else:
              sys.exit("could not find the title step in commit-lint.yml")
          EX
          chmod +x /tmp/cl.sh

          types='feat|fix|docs|chore|refactor|test|perf|build|ci|style|revert'

          # Valid shapes, including a scope and a breaking-change marker.
          while IFS= read -r title; do
            [ -n "$title" ] || continue
            if ! TITLE="$title" TYPES="$types" bash /tmp/cl.sh >/dev/null; then
              echo "::error::commit-lint refused a valid Conventional Commit: $title"
              exit 1
            fi
          done <<'TITLES'
          feat: add the thing
          fix(web-app): stop the crash
          chore!: drop support for the old shape
          TITLES
          echo "Valid titles pass."

          # And the shapes that must not merge.
          while IFS= read -r title; do
            [ -n "$title" ] || continue
            if TITLE="$title" TYPES="$types" bash /tmp/cl.sh >/dev/null 2>&1; then
              echo "::error::commit-lint accepted a title that is not a Conventional Commit: $title"
              exit 1
            fi
          done <<'TITLES'
          added a thing
          Feat: capitalised type
          feat:no space after the colon
          wip
          TITLES
          echo "Correctly refused."

  # B-57. Every fixture above was written by hand to satisfy the gate it tests,
  # which is why five bugs shipped this week: the fixture avoided the failing
  # case by accident, and nobody noticed until somebody's real repo hit it.
  #
  # `tests/fixtures/rendered-monorepo/` is not hand-written. It is `copier copy`
  # output from datumlabsio/scaffolds, committed as-is. It carries the two shapes
  # the hand-written fixtures never had:
  #
  #   - `.pre-commit-config.yaml` at the ROOT, with the component in a subfolder.
  #     python-ci looked for it beside the component and failed every monorepo.
  #   - TWO Dockerfiles. The container job picked one by priority and silently
  #     stopped building the other.
  #
  # Neither bug was findable by reading. Both are structural, and both are here.
  python-ci-rendered:
    uses: ./.github/workflows/python-ci.yml
    with:
      working-directory: tests/fixtures/rendered-monorepo/dlt-pipeline
      # Deliberately left on. The scaffold does not vendor
      # no-stale-quarantine.py, so this gate skips — and B-62's run summary now
      # says so rather than reporting a silent pass. That is the §11 hole, and
      # it is visible here on every run instead of being found by accident.
      stale-quarantine: true

  # The staleness guard does NOT live here, and the reason is structural.
  #
  # Re-rendering means cloning datumlabsio/scaffolds, which is PRIVATE. This
  # repository is PUBLIC and self-test deliberately carries no secrets — a fork's
  # pull request must never be handed a credential that reads a private repo.
  #
  # So the check belongs in `scaffolds`, which already renders its own output and
  # can read this fixture over the public raw URL. Inverting it also puts the
  # failure where the change was made, rather than failing this repo's CI for
  # something somebody did somewhere else. Tracked separately.
