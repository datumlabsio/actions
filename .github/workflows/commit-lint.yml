name: commit-lint

# Validates the pull request title against Conventional Commits. Callers pin a
# version tag:
#
#   jobs:
#     title:
#       uses: datumlabsio/actions/.github/workflows/commit-lint.yml@v0.1.0
#
# The title is what matters because a squash merge uses it as the commit
# message — so an unconventional title becomes an unversionable commit on main,
# and the release workflow cannot derive a version from it (DES §3, §10).
#
# DO NOT guard the call to this workflow with an `if:` in the caller. Use the
# `enabled` input. A caller doing this:
#
#   title:
#     if: inputs.commit-lint && github.event_name == 'pull_request'
#     uses: ./.github/workflows/commit-lint.yml
#
# works on a pull request and kills the entire run at STARTUP on a push. The job
# is skipped, and a skipped job holding a relative reference inside a workflow
# called from another repository cannot be resolved — the run reports
# "this run likely failed because of a workflow file issue", with no jobs and no
# log to read. Every archetype wrapper shipped that shape from v0.1.0 to v0.9.0,
# so every repo built from a scaffold had a permanently red default branch while
# its pull request checks stayed green.

on:
  workflow_call:
    inputs:
      enabled:
        description: >-
          Off switch. This lives here rather than as an `if:` on the caller's
          job, because guarding the call breaks a push run at startup — see the
          note above.
        type: boolean
        default: true

      allow-types:
        description: >-
          Pipe-separated Conventional Commit types accepted in a title.
        type: string
        default: "feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert"

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    # Both conditions belong here, not on the caller. Guarding inside means the
    # job is always CALLED and skips itself — same outcome for a reader, and it
    # does not break startup.
    if: inputs.enabled && github.event_name == 'pull_request'
    steps:
      - name: Title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
          TYPES: ${{ inputs.allow-types }}
        run: |
          python3 - <<'PY'
          import os, re, sys

          title = os.environ["TITLE"]
          types = os.environ["TYPES"]

          # type(optional scope)optional !: description
          pattern = rf"^({types})(\([a-z0-9._/-]+\))?!?: .+"

          if re.match(pattern, title):
              print(f"OK: {title}")
              sys.exit(0)

          print(f"::error::Pull request title is not a Conventional Commit: {title!r}")
          print("")
          print("A squash merge uses this title as the commit message on main, so an")
          print("unconventional title produces a commit the release workflow cannot")
          print("derive a version from.")
          print("")
          print(f"  Expected:  type: description        (types: {types.replace('|', ', ')})")
          print("  Optional:  type(scope): description")
          print("  Breaking:  type!: description   — or a BREAKING CHANGE: footer")
          print("")
          print("  Examples:  feat(python-ci): add coverage gate")
          print("             fix: stop the link check reading code spans")
          sys.exit(1)
          PY
