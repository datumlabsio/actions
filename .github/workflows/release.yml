name: release

# Cuts a SemVer release from Conventional Commits. Callers pin a version tag:
#
#   jobs:
#     release:
#       uses: datumlabsio/actions/.github/workflows/release.yml@v1.0.0
#
# DES §3 requires SemVer cut by CI from those commits. DES §10 requires that a
# published version is never changed and a tag is never moved, because rollback
# means deploying the last version that worked — and that only works if the
# versions stayed what they were.

on:
  workflow_call:
    inputs:
      tag-prefix:
        description: "Prefix on the tag. Empty for a bare SemVer."
        type: string
        default: "v"

      dry-run:
        description: >-
          Work out the version and print it, then stop. Nothing is tagged and
          nothing is published.
        type: boolean
        default: false

      create-github-release:
        description: "Publish a GitHub Release with the generated notes."
        type: boolean
        default: true

    outputs:
      version:
        description: "The version cut, or empty when there was nothing to release."
        value: ${{ jobs.release.outputs.version }}
      released:
        description: "'true' when a tag was created."
        value: ${{ jobs.release.outputs.released }}

# The one workflow that needs write. Everything else in this repo is read-only.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
      released: ${{ steps.tag.outputs.released }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Derive the next version
        id: derive
        env:
          PREFIX: ${{ inputs.tag-prefix }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, subprocess, sys

          prefix = os.environ["PREFIX"]

          def git(*args):
              return subprocess.run(
                  ["git", *args], capture_output=True, text=True, check=True
              ).stdout.strip()

          # Most recent tag matching our prefix, by version order rather than
          # by date — a tag pushed late must not look like the latest release.
          tags = [t for t in git("tag", "--list", f"{prefix}*").splitlines() if t]
          def key(t):
              m = re.match(rf"^{re.escape(prefix)}(\d+)\.(\d+)\.(\d+)$", t)
              return tuple(int(g) for g in m.groups()) if m else (-1, -1, -1)
          tags = sorted([t for t in tags if key(t) != (-1, -1, -1)], key=key)
          last = tags[-1] if tags else None

          rng = f"{last}..HEAD" if last else "HEAD"
          log = git("log", rng, "--format=%H%x1f%s%x1f%b%x1e")
          commits = [c for c in log.split("\x1e") if c.strip()]

          major = minor = patch = False
          for c in commits:
              parts = c.strip("\n").split("\x1f")
              subject = parts[1] if len(parts) > 1 else ""
              body = parts[2] if len(parts) > 2 else ""
              m = re.match(r"^([a-z]+)(\([^)]*\))?(!)?:", subject)
              if not m:
                  continue
              ctype, _, bang = m.groups()
              # Conventional Commits puts BREAKING CHANGE: in a footer after a
              # blank line. Without that blank line git folds the footer into
              # the subject, so both are searched — silently turning a breaking
              # change into a minor bump is the expensive mistake here.
              breaking = re.search(r"^BREAKING[ -]CHANGE:", body, re.M) or re.search(
                  r"\bBREAKING[ -]CHANGE:", subject
              )
              if bang or breaking:
                  major = True
              elif ctype == "feat":
                  minor = True
              elif ctype in ("fix", "perf"):
                  patch = True

          if last:
              cur = key(last)
          else:
              cur = (0, 0, 0)

          if major:
              # Below 1.0.0 a breaking change is a minor bump, which is what
              # SemVer says and what stops a pre-1.0 repo reaching v9.
              nxt = (cur[0] + 1, 0, 0) if cur[0] >= 1 else (cur[0], cur[1] + 1, 0)
              reason = "breaking change"
          elif minor:
              nxt = (cur[0], cur[1] + 1, 0)
              reason = "feature"
          elif patch:
              nxt = (cur[0], cur[1], cur[2] + 1)
              reason = "fix"
          else:
              print("version=")
              print("reason=nothing releasable")
              sys.exit(0)

          version = f"{prefix}{nxt[0]}.{nxt[1]}.{nxt[2]}"
          print(f"version={version}")
          print(f"previous={last or ''}")
          print(f"reason={reason}")
          print(f"commit_count={len(commits)}")
          PY

          if [ -z "$(grep '^version=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)" ]; then
            echo "::notice::No feat, fix or breaking commits since the last tag. Nothing to release."
          fi

      - name: Generate release notes
        id: notes
        if: steps.derive.outputs.version != ''
        env:
          PREV: ${{ steps.derive.outputs.previous }}
          VERSION: ${{ steps.derive.outputs.version }}
        run: |
          RANGE="HEAD"
          [ -n "$PREV" ] && RANGE="$PREV..HEAD"
          {
            echo "## $VERSION"
            echo
            for pair in "feat:Features" "fix:Fixes" "perf:Performance"; do
              t="${pair%%:*}"; heading="${pair#*:}"
              lines=$(git log "$RANGE" --format='%s' | grep -E "^$t(\([^)]*\))?!?: " || true)
              if [ -n "$lines" ]; then
                echo "### $heading"
                printf '%s\n' "$lines" | sed -E "s/^$t(\([^)]*\))?!?: /- /"
                echo
              fi
            done
            breaking=$(git log "$RANGE" --format='%s%n%b' | grep -E '^BREAKING[ -]CHANGE:' || true)
            if [ -n "$breaking" ]; then
              echo "### Breaking"
              printf '%s\n' "$breaking" | sed -E 's/^BREAKING[ -]CHANGE: */- /'
              echo
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      # A published version is never changed and a tag is never moved (DES §10).
      # Checked here rather than trusted, because the failure mode is silent:
      # a moved tag makes every pinned caller receive different code without
      # anything in their repo changing.
      - name: Tag, without ever moving one
        id: tag
        if: steps.derive.outputs.version != '' && !inputs.dry-run
        env:
          VERSION: ${{ steps.derive.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::$VERSION already exists locally. A published version is never re-cut (DES §10)."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::$VERSION already exists on the remote. A published version is never re-cut (DES §10)."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          # No --force, ever. If this push is rejected, that is the rule working.
          git push origin "refs/tags/$VERSION"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "Cut $VERSION"

      - name: Publish the release
        if: >-
          steps.derive.outputs.version != '' && !inputs.dry-run &&
          inputs.create-github-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.derive.outputs.version }}
        run: gh release create "$VERSION" --title "$VERSION" --notes-file RELEASE_NOTES.md

      - name: Dry run summary
        if: inputs.dry-run
        env:
          VERSION: ${{ steps.derive.outputs.version }}
          REASON: ${{ steps.derive.outputs.reason }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "Dry run: nothing releasable since the last tag."
          else
            echo "Dry run: would cut $VERSION ($REASON). Nothing was tagged."
          fi
