name: web-ci

# Reusable CI for JavaScript / TypeScript. Callers pin a version tag:
#
#   jobs:
#     ci:
#       uses: datumlabsio/actions/.github/workflows/web-ci.yml@v0.5.0
#
# Toolchain per DES §5 (RFC-0011): pnpm for packages, turbo for workspaces,
# Biome for lint and format, TypeScript strict, Vitest for tests and coverage.
#
# Configs are NOT fetched from here at runtime. Every repo carries its own
# vendored copy, put there by its scaffold and bumped like a dependency, so a
# developer's local run reads the same file CI reads. Tool versions come from the
# repo's web-tool-versions.txt for the same reason.

on:
  workflow_call:
    inputs:
      runner-label:
        description: >-
          Runner to schedule on. Leave at the default and every job runs on
          GitHub-hosted runners. Set it to a self-hosted label (datumlabsio
          uses "datum") only for a repo whose runner group actually grants
          that runner — a label no runner answers queues the job for 24
          hours rather than failing it.

          The org variable DATUM_RUNNER_OFFLINE is a kill switch over the
          top: while it is "true", every job here goes back to
          ubuntu-latest regardless of this input, so a dead runner does not
          stop merges. .github/workflows/runner-watch.yml keeps that
          variable honest; nothing here needs a credential to read it.
        type: string
        default: "ubuntu-latest"

      working-directory:
        description: "Directory holding the project, if it is not the repo root."
        type: string
        default: "."

      config-dir:
        description: >-
          Where the repo's vendored configs live, relative to
          working-directory.
        type: string
        default: "."

      lint:
        description: "Run biome ci (lint + format check in one pass)."
        type: boolean
        default: true

      typecheck:
        description: "Run tsc --noEmit."
        type: boolean
        default: true

      test:
        description: "Run vitest with coverage."
        type: boolean
        default: true

      build:
        description: "Run the repo's build script."
        type: boolean
        default: true

      phase:
        description: >-
          DES §11: a draft repo MUST report coverage but MAY fall below the
          threshold; a repo serving production MUST meet it. Reporting happens
          either way — only the gate waits.
        type: string
        default: "draft"

      coverage-threshold:
        description: "Percent of changed-line coverage required in production."
        type: number
        default: 80

      upload-artifacts:
        description: "Upload the build output and coverage report."
        type: boolean
        default: true

      stale-quarantine:
        description: >-
          DES §11: fail when a disabled test carries no owner and date, or its
          fix-or-delete date has passed. §12 lists this as CI-enforced and
          nothing enforced it, so a quarantined test could sit disabled forever.

          Phased in the same way as coverage: a repo that has not yet vendored
          no-stale-quarantine.py gets a notice telling it to, not a failure.
          Once every archetype ships the file, the notice becomes an error.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ${{ vars.DATUM_RUNNER_OFFLINE == 'true' && 'ubuntu-latest' || inputs.runner-label }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      CONFIG_DIR: ${{ inputs.config-dir }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The repo's vendored pins are the source of truth, not this workflow.
      # A repo that forgot to vendor the file gets a clear failure rather than
      # a silent fall back to whatever the runner ships.
      - name: Read the repo's pinned tool versions
        id: versions
        run: |
          set -euo pipefail
          f="$CONFIG_DIR/web-tool-versions.txt"
          if [ ! -f "$f" ]; then
            echo "::error::$f is missing. It is vendored by the scaffold and read here;"
            echo "without it there is no pinned toolchain and local runs cannot match CI."
            exit 1
          fi
          for key in node pnpm; do
            v=$(grep -E "^${key}=" "$f" | tail -1 | cut -d= -f2- | tr -d '[:space:]')
            if [ -z "$v" ]; then
              echo "::error::$f does not pin '$key'."
              exit 1
            fi
            echo "${key}=${v}" >> "$GITHUB_OUTPUT"
            echo "  ${key} = ${v}"
          done

      # Same reason as the uv steps: setup-node stores what it downloads in
      # the runner's TOOL CACHE, which on a self-hosted runner is shared,
      # root-owned and read-only on purpose. Unlike uv this one is version
      # PINNED, so it does not break on its own -- it breaks the day somebody
      # bumps node in tool-versions.txt, on a pull request that has nothing to
      # do with runners, and they get `ENOENT ... mkdir /opt/hostedtoolcache/
      # node/<new version>` with no clue why.
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/tool-cache
        with:
          node-version: ${{ steps.versions.outputs.node }}

      # Installed at the pinned version rather than via a third-party action.
      # One less action to pin and bump, and the version comes from the same
      # vendored file everything else reads.
      #
      # INTO THE JOB'S OWN TEMP, not npm's default global prefix. The default
      # is inside the Node install, which lives in the runner's TOOL CACHE --
      # shared by every job on a self-hosted runner. Two consequences, and the
      # second is the one that matters:
      #
      #   * a read-only tool cache fails the job outright, with
      #     `EROFS: read-only file system` and no mention of npm's prefix;
      #   * a WRITABLE one is worse, because it works -- one job can then leave
      #     a binary on PATH for the next job to execute.
      #
      # A per-job prefix has neither problem and is identical on GitHub-hosted,
      # where RUNNER_TEMP is wiped between jobs anyway.
      - name: Install pnpm
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-global"
          npm config set prefix "$RUNNER_TEMP/npm-global"
          echo "$RUNNER_TEMP/npm-global/bin" >> "$GITHUB_PATH"
          npm install --global "pnpm@${{ steps.versions.outputs.pnpm }}"

      # The store path is passed to `pnpm install` below rather than written to
      # pnpm's global config: `pnpm config set --global` first validates that
      # pnpm's global bin directory is on PATH and exits 1 on a runner where it
      # is not, which is every GitHub runner. Passing the flag has nothing to
      # validate.
      #
      # It is pinned to a fixed path rather than left to pnpm's default, which
      # differs by platform and pnpm version. A cache key pointing at the wrong
      # directory silently caches nothing, and nobody notices except in the bill.
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs.working-directory)) }}
          restore-keys: pnpm-${{ runner.os }}-

      # --frozen-lockfile is the point: CI must fail on a lockfile that does not
      # match package.json rather than quietly resolving something else.
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile --store-dir "$HOME/.pnpm-store"

      # ---------------------------------------------------------------------
      # EVERY GATE BELOW RUNS EVEN WHEN THE ONE BEFORE IT FAILED
      # ---------------------------------------------------------------------
      #
      # A step's `if:` carries an implicit `success()`, so a failing Typecheck
      # used to skip Test and Build, and the job was exactly as red either way —
      # nothing looked different while the tests stopped running. python-ci.yml
      # had the same shape and it hid every introspector test in polaris.
      #
      # `!cancelled()` replaces the implicit success(): each gate reports for
      # itself, and the job still fails if any of them failed. Gated on the
      # install having worked, because every tool failing on a missing
      # node_modules would bury the one error that matters.
      - name: Lint and format check
        id: lint
        if: ${{ inputs.lint && !cancelled() && steps.install.outcome == 'success' }}
        run: |
          set -euo pipefail
          cfg="$CONFIG_DIR/biome.json"
          if [ ! -f "$cfg" ]; then
            echo "::error::$cfg is missing. DES §5 makes the pinned linter the convention;"
            echo "a repo without the vendored config is not running the org's rules."
            exit 1
          fi
          # `biome ci` is lint + format check in one pass, and is non-writing by
          # design — it fails rather than reformatting, which is what CI wants.
          pnpm exec biome ci --config-path "$cfg" .

      - name: Typecheck
        id: typecheck
        if: ${{ inputs.typecheck && !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec tsc --noEmit

      - name: Test with coverage
        if: ${{ inputs.test && !cancelled() && steps.install.outcome == 'success' }}
        id: test
        env:
          PHASE: ${{ inputs.phase }}
          THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          set -euo pipefail

          # DES §11, as amended by RFC-0011: coverage is REPORTED in every
          # phase so the number is visible and the trend is real. The threshold
          # is enforced only once a repo serves production. Reporting
          # unconditionally is what stops "we'll add tests later" from being
          # invisible.
          pnpm exec vitest run --coverage --coverage.reporter=text \
            --coverage.reporter=json-summary --coverage.reporter=lcov

          summary="coverage/coverage-summary.json"
          if [ ! -f "$summary" ]; then
            echo "::warning::no coverage summary at $summary; cannot report a number."
            exit 0
          fi

          pct=$(node -e "
            const s = require('./$summary');
            process.stdout.write(String(s.total.lines.pct));
          ")
          echo "Line coverage: ${pct}%"
          echo "coverage=$pct" >> "$GITHUB_OUTPUT"
          echo "### Coverage: ${pct}%" >> "$GITHUB_STEP_SUMMARY"

          below=$(node -e "process.stdout.write(($pct < $THRESHOLD) ? 'yes' : 'no')")

          if [ "$below" = "yes" ]; then
            if [ "$PHASE" = "production" ]; then
              echo "::error::Coverage ${pct}% is below the ${THRESHOLD}% required for a repo serving production (DES §11)."
              exit 1
            fi
            echo "::notice::Coverage ${pct}% is below ${THRESHOLD}%. Allowed while this repo is in draft phase; it will block once it serves production (DES §11)."
          fi

      - name: Build
        id: build
        if: ${{ inputs.build && !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run build

      - name: Upload build output and coverage
        if: inputs.upload-artifacts && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-${{ github.run_id }}
          path: |
            ${{ inputs.working-directory }}/dist
            ${{ inputs.working-directory }}/.next
            ${{ inputs.working-directory }}/coverage
          if-no-files-found: ignore
          retention-days: 7
      - name: No stale or unowned quarantines (DES §11)
        id: quarantine
        if: ${{ inputs.stale-quarantine && !cancelled() && steps.install.outcome == 'success' }}
        env:
          CONFIG_DIR_IN: ${{ inputs.config-dir || '.' }}
        run: |
          set -euo pipefail
          script="$CONFIG_DIR_IN/no-stale-quarantine.py"
          if [ ! -f "$script" ]; then
            echo "::notice::$script not vendored yet — skipping the DES §11 quarantine check."
            echo "::notice::Vendor it from datumlabsio/actions/configs/ (or bump your scaffold) to switch this gate on."
            echo "no-stale-quarantine — not vendored" >> "$RUNNER_TEMP/datum-skipped.txt"
            exit 0
          fi
          if ! head -3 "$script" | grep -q '^# datum-config:'; then
            echo "::error::$script has no '# datum-config:' version stamp. A vendored config is bumped, never hand-written."
            exit 1
          fi
          python3 "$script" .

      # A gate that skips itself and a gate that passes are indistinguishable from
      # outside: both green, both exit 0. §11's quarantine check had never run in
      # polaris while CI reported success the whole time.
      #
      # `always()`, because a run that FAILED still has to say what it did — that
      # is exactly when the question gets asked.
      - name: What this run actually did
        if: always()
        env:
          WORKDIR: ${{ inputs.working-directory }}
          REQUESTED: >-
            biome:${{ inputs.lint }}
            tsc:${{ inputs.typecheck }}
            vitest:${{ inputs.test }}
            build:${{ inputs.build }}
            no-stale-quarantine:${{ inputs.stale-quarantine }}
          # What each step DID, not what was asked of it. Inferring "ran" from
          # the input alone reported a skipped gate as having run.
          OUTCOMES: >-
            biome:${{ steps.lint.outcome }}
            tsc:${{ steps.typecheck.outcome }}
            vitest:${{ steps.test.outcome }}
            build:${{ steps.build.outcome }}
            no-stale-quarantine:${{ steps.quarantine.outcome }}
        run: |
          set -euo pipefail
          skips="$RUNNER_TEMP/datum-skipped.txt"
          [ -f "$skips" ] || : > "$skips"

          outcome_of() {
            for pair in $OUTCOMES; do
              if [ "${pair%%:*}" = "$1" ]; then
                echo "${pair#*:}"
                return
              fi
            done
          }

          passed=""; failed=""; off=""
          for pair in $REQUESTED; do
            name="${pair%%:*}"
            on="${pair##*:}"
            if [ "$on" != "true" ]; then
              off="${off}${off:+, }${name}"
              continue
            fi
            # A gate that ran and chose to skip itself (a config not vendored)
            # says so in the skips file, and is listed from there below.
            if grep -q "^${name} " "$skips"; then
              continue
            fi
            case "$(outcome_of "$name")" in
              success) passed="${passed}${passed:+, }${name}" ;;
              failure) failed="${failed}${failed:+, }${name}" ;;
              # A step held back by `!cancelled()` reports `skipped`, not
              # `cancelled`, so the two are not told apart here. Both mean the
              # gate never ran, which is the fact that has to be visible.
              *) echo "${name} — did not run (setup failed, or the run was cancelled)" >> "$skips" ;;
            esac
          done

          skipped=$(paste -sd';' - < "$skips" | sed 's/;/; /g')

          {
            echo "### web-ci — \`${WORKDIR:-.}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Passed | ${passed:-none} |"
            echo "| **Failed** | ${failed:-none} |"
            echo "| **Skipped** | ${skipped:-none} |"
            echo "| Off by config | ${off:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Loud in the log too, so it is visible without opening the summary tab.
          if [ -n "$skipped" ]; then
            echo "::warning::Gates skipped: ${skipped}"
          fi
