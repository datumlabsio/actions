name: gitops-ci

# Reusable CI for the `gitops` archetype: one install's desired state, pulled by
# that install's Flux. Callers pin an exact version:
#
#   jobs:
#     ci:
#       uses: datumlabsio/actions/.github/workflows/gitops-ci.yml@v0.2.0
#
# This repo is never pushed to a cluster by CI. Flux pulls from it (DES §4), so
# nothing here needs cluster credentials and nothing here is granted any.
#
# Every gate runs without a cluster. `kustomize build` renders offline and
# kubeconform validates the result against schemas, so a pull request is checked
# in seconds rather than against a live reconciler.

on:
  workflow_call:
    inputs:
      root:
        description: "Directory holding the desired state, if not the repo root."
        type: string
        default: "."

      config-dir:
        description: "Where the vendored configs live, relative to root."
        type: string
        default: "."

      kubernetes-version:
        description: "API version kubeconform validates against."
        type: string
        default: "1.31.0"

      generic-paths:
        description: >-
          Space-separated paths that must stay reusable across installs — no
          hostname, no IP, no client name. Empty skips the check.
        type: string
        default: "platform applications charts"

      chart-paths:
        description: "Where charts we author live. Empty skips helm lint."
        type: string
        default: "charts"

      yamllint:
        type: boolean
        default: true

      build:
        description: "kustomize build every overlay, then validate the output."
        type: boolean
        default: true

      ignore-missing-schemas:
        description: >-
          Let kubeconform pass a custom resource it has no schema for. Off by
          default: a CRD with no schema is unvalidated, and silently unvalidated
          is how a broken manifest reaches a cluster.
        type: boolean
        default: false

      image-pinning:
        description: "Fail on a :latest or untagged image."
        type: boolean
        default: true

      plaintext-secrets:
        description: "Fail on a Secret with inline data."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gitops:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.root }}
    env:
      CONFIG_DIR: ${{ inputs.config-dir }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Vendored configs present and stamped
        run: |
          missing=0
          for f in .yamllint gitops-tool-versions.txt; do
            p="$CONFIG_DIR/$f"
            if [ ! -f "$p" ]; then
              echo "::error::$p not found. It is vendored in by the scaffold — copy it from datumlabsio/actions/configs/."
              missing=1
              continue
            fi
            if ! head -3 "$p" | grep -q '^# datum-config:'; then
              echo "::error::$p has no '# datum-config:' version stamp. A vendored config is bumped, never hand-written."
              missing=1
              continue
            fi
            echo "  $(head -1 "$p" | sed 's/^# //')  ($p)"
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          # Versions come from the repo's own vendored pins, so a local run and
          # CI use the same ones.
          get() { grep "^$1=" "$CONFIG_DIR/gitops-tool-versions.txt" | cut -d= -f2; }
          KUSTOMIZE=$(get kustomize); KUBECONFORM=$(get kubeconform)
          HELM=$(get helm);           YAMLLINT=$(get yamllint)
          mkdir -p "$RUNNER_TEMP/bin"

          curl -sSL --fail "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE}/kustomize_${KUSTOMIZE}_linux_amd64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/bin" kustomize
          curl -sSL --fail "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/bin" kubeconform
          curl -sSL --fail "https://get.helm.sh/helm-${HELM}-linux-amd64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/bin" --strip-components=1 linux-amd64/helm
          pipx install "yamllint==${YAMLLINT}" >/dev/null

          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/kustomize" version
          "$RUNNER_TEMP/bin/kubeconform" -v
          "$RUNNER_TEMP/bin/helm" version --short

      - name: YAML lint
        if: inputs.yamllint
        run: |
          set -euo pipefail
          # A Helm chart's templates/ holds Go templates, not YAML. `{{- if }}`
          # and `{{- define }}` are not parseable as YAML and never will be, so
          # yamllint reports a syntax error on every one of them. They ARE
          # validated — by `helm lint` below, and by kubeconform on the rendered
          # output, which is the only point at which they are YAML at all.
          #
          # Excluded by path rather than by a rule in .yamllint, because that file
          # is vendored into repos at different depths and deliberately carries no
          # path-shaped keys.
          files=$(git ls-files '*.yaml' '*.yml' \
                   | grep -vE '(^|/)charts/[^/]+/templates/' || true)
          if [ -z "$files" ]; then
            echo "::notice::No YAML outside Helm chart templates. Nothing for yamllint to check."
            echo "yamllint — no YAML outside chart templates" >> "$RUNNER_TEMP/datum-skipped.txt"
            exit 0
          fi
          echo "$files" | xargs yamllint -c "$CONFIG_DIR/.yamllint"

      - name: Charts we author lint clean
        if: inputs.chart-paths != ''
        run: |
          set -euo pipefail
          found=0
          for base in ${{ inputs.chart-paths }}; do
            [ -d "$base" ] || continue
            while IFS= read -r chart; do
              found=1
              echo "== helm lint $(dirname "$chart") =="
              helm lint "$(dirname "$chart")"
            done < <(find "$base" -name Chart.yaml)
          done
          if [ "$found" -ne 1 ]; then
            echo "::notice::No charts found under ${{ inputs.chart-paths }}; nothing to lint."
            echo "helm-lint — no charts under ${{ inputs.chart-paths }}" >> "$RUNNER_TEMP/datum-skipped.txt"
          fi

      # kustomize build renders offline, so every overlay is validated without a
      # cluster. kubeconform then checks the result against real API schemas —
      # including Flux's own CRDs, from the community catalog.
      - name: Build every overlay and validate the output
        if: inputs.build
        env:
          K8S_VERSION: ${{ inputs.kubernetes-version }}
          IGNORE_MISSING: ${{ inputs.ignore-missing-schemas }}
        run: |
          set -euo pipefail
          CRDS="https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          extra=()
          [ "$IGNORE_MISSING" = "true" ] && extra=(-ignore-missing-schemas)

          # CustomResourceDefinition is skipped by kind, narrowly and out loud.
          #
          # No schema for it exists in either catalog: the upstream generator
          # publishes the CRD's *sub*-schemas — customresourcedefinitionnames,
          # customresourcedefinitionstatus, customresourceconversion — but not
          # the top-level kind, so kubeconform errors on every CRD a repo
          # declares. With ignore-missing-schemas off, as it should stay, that
          # made adding any CRD to a gitops repo impossible.
          #
          # This skips the CRD wrapper only. A custom *resource* is untouched
          # and still validated against the catalog above, which is what the
          # ignore-missing-schemas warning is actually about. The wrapper is
          # not unchecked either: kustomize build parses it, yamllint checks it,
          # and the API server validates it structurally on apply.
          extra+=(-skip CustomResourceDefinition)

          overlays=$(find . -name kustomization.yaml -not -path './.git/*' -exec dirname {} \; | sort)
          if [ -z "$overlays" ]; then
            echo "::error::No kustomization.yaml anywhere. A gitops repo's desired state is built by kustomize."
            exit 1
          fi

          rc=0
          for dir in $overlays; do
            echo "== kustomize build $dir =="
            if ! kustomize build "$dir" > "$RUNNER_TEMP/rendered.yaml"; then
              echo "::error::kustomize build failed in $dir"
              rc=1
              continue
            fi
            if ! kubeconform -strict -summary \
                 -kubernetes-version "$K8S_VERSION" \
                 -schema-location default -schema-location "$CRDS" \
                 "${extra[@]}" "$RUNNER_TEMP/rendered.yaml"; then
              echo "::error::kubeconform rejected the output of $dir"
              rc=1
            fi
          done
          exit "$rc"

      # An image without a tag, or on :latest, means the cluster's actual state
      # depends on when it last pulled. Rollback cannot work against that.
      - name: Images are pinned
        if: inputs.image-pinning
        run: |
          set -euo pipefail
          hits=$(grep -rnE '^\s*image:\s*\S+' --include='*.yaml' --include='*.yml' . \
                 | grep -vE '@sha256:[0-9a-f]{64}' \
                 | grep -E ':latest\s*$|image:\s*[^:@[:space:]]+\s*$' || true)
          if [ -n "$hits" ]; then
            echo "::error::An image is on :latest or has no tag. Pin a tag, or better a digest:"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "Every image is pinned."

      - name: No plaintext secrets
        if: inputs.plaintext-secrets
        run: |
          set -euo pipefail
          # A Secret with inline data belongs in the secret manager, referenced
          # by SealedSecret or ExternalSecret. DES §6 has no exceptions.
          hits=$(grep -rlE '^kind:\s*Secret\s*$' --include='*.yaml' --include='*.yml' . || true)
          bad=""
          for f in $hits; do
            if grep -qE '^\s*(data|stringData):\s*$' "$f"; then
              bad="$bad $f"
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error::A Secret carries inline data. Reference the secret manager instead (DES §6):"
            for f in $bad; do echo "  $f"; done
            exit 1
          fi
          echo "No plaintext secrets."

      # A file that names one client cannot be updated from the template, and it
      # is how a component quietly stops being reusable.
      # A file that names one client cannot be updated from the template, and it
      # is how a component quietly stops being reusable.
      #
      # THIS PARSES YAML. It used to grep, and grep cannot see structure — so it
      # read Kubernetes label KEYS as hostnames, then CRD API groups, then RBAC
      # `apiGroups`. Each was patched with another exclusion pattern. CLAUDE.md
      # already lists this gate among four occurrences of the same bug class, and
      # a fifth exclusion would have been the fourth patch to a regex that cannot
      # answer the question being asked: is this string a hostname reference, or
      # an API group, a label key, an image ref, an apiVersion? That is a question
      # about position in the document.
      #
      # Nothing is exempted that was not exempt before. Keys are no longer checked
      # at all, which removes the label problem rather than excluding it.
      - name: Reusable paths name no install
        if: inputs.generic-paths != ''
        env:
          PATHS: ${{ inputs.generic-paths }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 - <<'PY'
          from __future__ import annotations
          import ipaddress
          import os
          import re
          import sys
          from pathlib import Path
          import yaml
          # A hostname-shaped value, or a dotted-quad IP.
          HOSTNAME = re.compile(r"^(?:[a-z0-9-]+\.)+(?:com|io|net|dev|local)$", re.I)
          # `ipaddress` rather than a regex plus a literal set of addresses. More correct
          # — it knows 127.0.0.2 is loopback and 169.254.x is link-local — and it keeps
          # hardcoded addresses out of a public repository, which this repo's own
          # no_literal_env_values gate enforces and which caught the first version of this.
          def _is_routable_ip(value):
              try:
                  addr = ipaddress.ip_address(value)
              except ValueError:
                  return False
              return not (addr.is_loopback or addr.is_unspecified or addr.is_link_local)
          # Infrastructure domains that are not an install. These appear in every cluster.
          INFRA = re.compile(
              r"(^|\.)(kubernetes\.io|k8s\.io|helm\.sh|fluxcd\.io|githubusercontent\.com)$"
              r"|^cluster\.local$|^datum\.local$",
              re.I,
          )
          # Keys whose values are never a hostname reference, by what Kubernetes means.
          #
          #   image / repository  — a registry host. The image-pinning gate owns those.
          #   apiGroups           — RBAC. `platform.datumlabs.io` here is an API group.
          #   group               — a CustomResourceDefinition's spec.group.
          #   apiVersion          — `rbac.authorization.k8s.io/v1`.
          #   kind / name         — see below; `name` is conditional.
          NEVER_A_HOST = {"image", "repository", "apigroups", "apiversion", "group"}
          # Go template directives. A line that is ONLY a directive is dropped; an inline
          # one becomes a placeholder scalar. Without this every Helm template fails to
          # parse, and those are exactly the files this gate must read.
          # Helm COMMENTS first, and by their own delimiters. A comment may contain
          # escaped braces — `{{ "{{" }}job{{ "}}" }}` is how a chart writes Grafana's
          # legend syntax without Helm executing it — and a non-greedy `{{ … }}` match
          # stops at the first `}}`, which is inside the comment. `/* … */` is
          # unambiguous where `{{ … }}` is not.
          TPL_COMMENT = re.compile(r"\{\{-?\s*/\*.*?\*/\s*-?\}\}", re.S)
          TPL_SPAN = re.compile(r"\{\{.*?\}\}", re.S)
          TPL_INLINE = re.compile(r"\{\{-?.*?-?\}\}")
          TPL_WHOLE_LINE = re.compile(r"^\s*\{\{-?.*?-?\}\}\s*$")
          def neutralise(text: str) -> str:
              # Collapse first. A Go template expression can span lines — a `{{- /* … */}}`
              # comment block is the common one, and `{{- range … }}` arguments wrap — and
              # line-based rules cannot see a construct that is not on one line. Every
              # Helm template in polaris that failed to parse failed for this reason.
              # Replaced with the newlines it consumed, not with a space. A template
              # construct can sit inside a YAML literal block (`extraEnv: |`), where
              # indentation is load-bearing — collapsing several lines into one stray
              # indented space redefines the block's baseline and the file stops parsing.
              text = TPL_COMMENT.sub(lambda m: "\n" * m.group(0).count("\n"), text)
              text = TPL_SPAN.sub(lambda m: m.group(0).replace("\n", " "), text)
              out = []
              for line in text.splitlines():
                  if TPL_WHOLE_LINE.match(line):
                      continue
                  out.append(TPL_INLINE.sub("TPL", line))
              return "\n".join(out)
          def looks_like_host(v: str) -> bool:
              v = v.strip().strip("\"'")
              if not v:
                  return False
              if _is_routable_ip(v):
                  return True
              if not HOSTNAME.match(v):
                  return False
              return not INFRA.search(v)
          def is_crd_name(value: str, path: list) -> bool:
              """A CustomResourceDefinition's metadata.name.
              It is <plural>.<group> — shaped exactly like a hostname, and not one. Only
              accepted directly under `metadata`, so `name:` anywhere else is still
              checked.
              """
              return len(path) >= 2 and path[-1] == "name" and path[-2] == "metadata"
          def walk(node, path, out):
              if isinstance(node, dict):
                  for k, v in node.items():
                      walk(v, path + [str(k).lower()], out)
              elif isinstance(node, list):
                  for item in node:
                      # A list item inherits its key: `apiGroups: [a, b]` keeps `apigroups`.
                      walk(item, path, out)
              elif isinstance(node, str):
                  out.append((list(path), node))
          def check(paths):
              present = [p for p in paths if Path(p).is_dir()]
              if not present:
                  print(f"::notice::None of {' '.join(paths)} exist; nothing to check.")
                  skip = os.environ.get("RUNNER_TEMP")
                  if skip:
                      with open(Path(skip) / "datum-skipped.txt", "a") as fh:
                          fh.write(f"reusable-paths — none of {' '.join(paths)} exist\n")
                  return 0
              files, hits, unreadable = 0, [], []
              for base in present:
                  for f in sorted(Path(base).rglob("*")):
                      if f.suffix not in (".yaml", ".yml") or not f.is_file():
                          continue
                      files += 1
                      raw = f.read_text(encoding="utf-8", errors="replace")
                      try:
                          docs = list(yaml.safe_load_all(neutralise(raw)))
                      except yaml.YAMLError as exc:
                          # NOT swallowed. An unreadable file is a file this gate said
                          # nothing about, and "found nothing" must never be the same
                          # output as "could not look".
                          unreadable.append((f, str(exc).split("\n")[0]))
                          continue
                      for doc in docs:
                          found = []
                          walk(doc, [], found)
                          for keypath, value in found:
                              if not looks_like_host(value):
                                  continue
                              key = keypath[-1] if keypath else ""
                              if key in NEVER_A_HOST:
                                  continue
                              if is_crd_name(value, keypath):
                                  continue
                              hits.append((f, ".".join(keypath) or "(root)", value))
              print(f"checked {files} YAML file(s) under {', '.join(present)}")
              if unreadable:
                  print("::error::These files could not be parsed, so this gate says "
                        "nothing about them:")
                  for f, why in unreadable:
                      print(f"  {f}: {why}")
                  return 1
              if hits:
                  print("::error::A hostname or IP appears in a path that must stay "
                        "reusable across installs. Move it to this install's values.")
                  for f, keypath, value in hits:
                      print(f"  {f}  {keypath}: {value}")
                  return 1
              print("Reusable paths are install-agnostic.")
              return 0
          raise SystemExit(check(os.environ["PATHS"].split()))

          PY

      # A gate that skips itself and a gate that passes are indistinguishable from
      # outside: both green, both exit 0. §11's quarantine check had never run in
      # polaris while CI reported success the whole time.
      #
      # This workflow has three ways to skip, and all three are "nothing to check"
      # rather than "config missing" — which is usually correct, and is exactly
      # why it needs saying out loud. A gitops repo whose charts moved would
      # report the same silence as one that never had any.
      #
      # `always()`, because a run that FAILED still has to say what it did.
      - name: What this run actually did
        if: always()
        env:
          ROOT: ${{ inputs.root }}
          REQUESTED: >-
            yamllint:${{ inputs.yamllint }}
            helm-lint:${{ inputs.chart-paths != '' }}
            kubeconform:${{ inputs.build }}
            image-pinning:${{ inputs.image-pinning }}
            plaintext-secrets:${{ inputs.plaintext-secrets }}
            reusable-paths:${{ inputs.generic-paths != '' }}
        run: |
          set -euo pipefail
          skips="$RUNNER_TEMP/datum-skipped.txt"
          [ -f "$skips" ] || : > "$skips"

          ran=""; off=""
          for pair in $REQUESTED; do
            name="${pair%%:*}"
            on="${pair##*:}"
            if [ "$on" != "true" ]; then
              off="${off}${off:+, }${name}"
            elif ! grep -q "^${name} " "$skips"; then
              ran="${ran}${ran:+, }${name}"
            fi
          done

          skipped=$(paste -sd';' - < "$skips" | sed 's/;/; /g')

          {
            echo "### gitops-ci — \`${ROOT:-.}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Ran | ${ran:-none} |"
            echo "| **Skipped** | ${skipped:-none} |"
            echo "| Off by config | ${off:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Loud in the log too, so it is visible without opening the summary tab.
          if [ -n "$skipped" ]; then
            echo "::warning::Gates skipped: ${skipped}"
          fi
