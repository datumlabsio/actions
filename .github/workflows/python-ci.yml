name: python-ci

# Reusable CI for Python. Callers pin a version tag:
#
#   jobs:
#     ci:
#       uses: datumlabsio/actions/.github/workflows/python-ci.yml@v0.1.0
#
# Configs are NOT fetched from here at runtime. Every repo carries its own
# vendored copy, put there by its scaffold and bumped like a dependency, so a
# developer's local run reads the same file CI reads. The canonical copies live
# in configs/ — see configs/README.md. Tool versions come from the repo's
# tool-versions.txt for the same reason.

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version for uv to install."
        type: string
        default: "3.12"

      working-directory:
        description: "Directory holding the project, if it is not the repo root."
        type: string
        default: "."

      config-dir:
        description: >-
          Where the repo's vendored configs live, relative to
          working-directory.
        type: string
        default: "."

      lint:
        description: "Run ruff check and ruff format --check."
        type: boolean
        default: true

      typecheck:
        description: "Run mypy."
        type: boolean
        default: true

      test:
        description: "Run pytest."
        type: boolean
        default: true

      pre-commit:
        description: >-
          Run the repo's pre-commit hooks. DES §3 requires a pre-commit config
          and a CI stage running the same hooks, so this defaults on and fails
          when the config is missing.
        type: boolean
        default: true

      coverage:
        description: >-
          Report test coverage. §11 scopes the requirement to application,
          web-app and dagster-user-code — a dlt-pipeline is exempt — so this is
          off unless the archetype asks for it.
        type: boolean
        default: false

      phase:
        description: >-
          DES §11: a draft repo MUST report coverage but MAY fall below the
          threshold; a repo serving production MUST meet it. Reporting happens
          either way — only the gate waits. Same phase-in as web-ci.
        type: string
        default: "draft"

      coverage-threshold:
        description: "Percent of coverage required once the repo serves production."
        type: number
        default: 80

      stale-quarantine:
        description: >-
          DES §11: fail when a disabled test carries no owner and date, or its
          fix-or-delete date has passed. §12 lists this as CI-enforced and
          nothing enforced it, so a quarantined test could sit disabled forever.

          Phased in the same way as coverage: a repo that has not yet vendored
          no-stale-quarantine.py gets a notice telling it to, not a failure.
          Once every archetype ships the file, the notice becomes an error.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      CONFIG_DIR: ${{ inputs.config-dir }}
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install "${{ inputs.python-version }}"

      # Fail here, with an actionable message, rather than three steps later
      # with ruff complaining about a file it cannot find.
      - name: Vendored configs present and stamped
        run: |
          missing=0
          for f in ruff.toml mypy.ini tool-versions.txt; do
            p="$CONFIG_DIR/$f"
            if [ ! -f "$p" ]; then
              echo "::error::$p not found. It is vendored in by the scaffold — copy it from datumlabsio/actions/configs/."
              missing=1
              continue
            fi
            if ! head -3 "$p" | grep -q '^# datum-config:'; then
              echo "::error::$p has no '# datum-config:' version stamp. A vendored config is bumped, never hand-written."
              missing=1
              continue
            fi
            echo "  $(head -1 "$p" | sed 's/^# //')  ($p)"
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Sync dependencies
        run: |
          if [ -f uv.lock ]; then
            uv sync --frozen --all-extras --dev
          elif [ -f pyproject.toml ]; then
            uv sync --all-extras --dev
          else
            echo "::notice::No pyproject.toml; running tools without a project environment."
          fi

      - name: Lint
        if: inputs.lint
        run: |
          uv run --with-requirements "$CONFIG_DIR/tool-versions.txt" -- \
            ruff check --config "$CONFIG_DIR/ruff.toml" .
          uv run --with-requirements "$CONFIG_DIR/tool-versions.txt" -- \
            ruff format --check --config "$CONFIG_DIR/ruff.toml" .

      - name: Type check
        if: inputs.typecheck
        run: |
          uv run --with-requirements "$CONFIG_DIR/tool-versions.txt" -- \
            mypy --config-file "$CONFIG_DIR/mypy.ini" .

      - name: Test
        if: inputs.test
        env:
          PHASE: ${{ inputs.phase }}
          THRESHOLD: ${{ inputs.coverage-threshold }}
          WITH_COVERAGE: ${{ inputs.coverage }}
        run: |
          set -euo pipefail
          if [ "$WITH_COVERAGE" != "true" ]; then
            uv run --with-requirements "$CONFIG_DIR/tool-versions.txt" -- pytest -q
            exit 0
          fi

          # §11: coverage is REPORTED in every phase so the number is visible and
          # the trend is real. The threshold is enforced only once the repo serves
          # production. Reporting unconditionally is what stops "we'll add tests
          # later" from being invisible.
          uv run --with-requirements "$CONFIG_DIR/tool-versions.txt" \
            --with pytest-cov -- \
            pytest -q --cov --cov-report=term --cov-report=json:coverage.json

          if [ ! -f coverage.json ]; then
            echo "::warning::No coverage.json was written; cannot report a number."
            exit 0
          fi
          pct=$(python3 -c "import json;print(round(json.load(open('coverage.json'))['totals']['percent_covered'],1))")
          echo "Coverage: ${pct}%"

          if python3 -c "import sys;sys.exit(0 if float('${pct}') < float('${THRESHOLD}') else 1)"; then
            if [ "$PHASE" = "production" ]; then
              echo "::error::Coverage ${pct}% is below ${THRESHOLD}% and this repo serves production (DES §11)."
              exit 1
            fi
            echo "::notice::Coverage ${pct}% is below ${THRESHOLD}%. Allowed in draft phase; it blocks once this repo serves production (DES §11)."
          fi

      - name: Pre-commit hooks
        if: inputs.pre-commit
        run: |
          set -euo pipefail
          # The config lives at the REPOSITORY root, never inside a component
          # folder — that is where the scaffold puts it and where pre-commit
          # resolves hooks from. This step runs with `working-directory` set to
          # the component, so looking for the config here found nothing in every
          # monorepo and failed a gate no repo could satisfy.
          #
          # `pre-commit run --all-files` already walked the whole git repo, so
          # only the lookup was ever wrong.
          reqs="$(cd "$CONFIG_DIR" && pwd)/tool-versions.txt"
          root="$(git rev-parse --show-toplevel)"
          if [ ! -f "$root/.pre-commit-config.yaml" ]; then
            echo "::error::No .pre-commit-config.yaml at the repository root. DES §3 requires one, and a CI stage that runs the same hooks."
            exit 1
          fi
          cd "$root"
          uv run --with-requirements "$reqs" -- \
            pre-commit run --all-files --show-diff-on-failure
      - name: No stale or unowned quarantines (DES §11)
        if: ${{ inputs.stale-quarantine }}
        env:
          CONFIG_DIR_IN: ${{ inputs.config-dir || '.' }}
        run: |
          set -euo pipefail
          script="$CONFIG_DIR_IN/no-stale-quarantine.py"
          if [ ! -f "$script" ]; then
            echo "::notice::$script not vendored yet — skipping the DES §11 quarantine check."
            echo "::notice::Vendor it from datumlabsio/actions/configs/ (or bump your scaffold) to switch this gate on."
            echo "no-stale-quarantine — not vendored" >> "$RUNNER_TEMP/datum-skipped.txt"
            exit 0
          fi
          if ! head -3 "$script" | grep -q '^# datum-config:'; then
            echo "::error::$script has no '# datum-config:' version stamp. A vendored config is bumped, never hand-written."
            exit 1
          fi
          python3 "$script" .

      # A gate that skips itself and a gate that passes are indistinguishable from
      # outside: both green, both exit 0. §11's quarantine check had never run in
      # polaris while CI reported success the whole time.
      #
      # `always()`, because a run that FAILED still has to say what it did — that
      # is exactly when the question gets asked.
      - name: What this run actually did
        if: always()
        env:
          WORKDIR: ${{ inputs.working-directory }}
          REQUESTED: >-
            ruff:${{ inputs.lint }}
            mypy:${{ inputs.typecheck }}
            pytest:${{ inputs.test }}
            pre-commit:${{ inputs.pre-commit }}
            no-stale-quarantine:${{ inputs.stale-quarantine }}
        run: |
          set -euo pipefail
          skips="$RUNNER_TEMP/datum-skipped.txt"
          [ -f "$skips" ] || : > "$skips"

          ran=""; off=""
          for pair in $REQUESTED; do
            name="${pair%%:*}"
            on="${pair##*:}"
            if [ "$on" != "true" ]; then
              off="${off}${off:+, }${name}"
            elif ! grep -q "^${name} " "$skips"; then
              ran="${ran}${ran:+, }${name}"
            fi
          done

          skipped=$(paste -sd';' - < "$skips" | sed 's/;/; /g')

          {
            echo "### python-ci — \`${WORKDIR:-.}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Ran | ${ran:-none} |"
            echo "| **Skipped** | ${skipped:-none} |"
            echo "| Off by config | ${off:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Loud in the log too, so it is visible without opening the summary tab.
          if [ -n "$skipped" ]; then
            echo "::warning::Gates skipped: ${skipped}"
          fi
