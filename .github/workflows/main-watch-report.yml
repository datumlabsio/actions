name: main-watch-report

# Half of B-54. `main-watch` runs the gates against the default branch on a
# schedule; this turns the result into something a person actually sees.
#
# A failing scheduled run is invisible. Nobody opens the Actions tab of a repo
# that is not currently on fire, which is the same failure mode as the permanently
# red push run that was deleted — a signal nobody reads is not a signal.
#
# So: an open issue while `main` is broken, closed automatically when it recovers.
# One issue, reused, rather than one per week.
#
# It deliberately does NOT nest a `uses:` job. A cross-repository called workflow
# that references its stages relatively dies at STARTUP on a non-`pull_request`
# event, with no job, no step and no log (B-52). A schedule is a non-`pull_request`
# event, so everything here runs as steps.

on:
  workflow_call:
    inputs:
      failed:
        description: "'true' when any watched gate failed. Anything else is treated as healthy."
        type: string
        required: true

      details:
        description: "What failed, one per line. Goes into the issue body."
        type: string
        default: ""

      title:
        description: "Issue title. Fixed, because it is how the existing issue is found again."
        type: string
        default: "`main` is failing its own gates"

    secrets:
      # DEPRECATED and unused since v0.24.0. Kept accepted so that a Renovate
      # bump of the `uses:` pin does not break a caller whose template has not
      # been re-rendered yet — an unknown secret is a STARTUP failure, with no
      # job and no log (B-52).
      #
      # They are not silently ignored: passing them logs a notice saying so.
      # An input accepted and quietly discarded is the `delete_branch_on_merge`
      # trap, where a caller believes it configured something it did not.
      app-id:
        description: "DEPRECATED, unused. This workflow uses GITHUB_TOKEN."
        required: false
      private-key:
        description: "DEPRECATED, unused. This workflow uses GITHUB_TOKEN."
        required: false

# `issues: write` must be granted by the CALLER. A called workflow can only
# reduce the caller's permissions, never add to them.
permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      # This used to mint a `datum-police` token. It did not work where it was
      # needed most: the App credentials are ORGANISATION secrets scoped to
      # selected repositories, so every newly created repository received an
      # empty string, skipped the job, and reported success. A weekly scheduled
      # run that is green and does nothing is worse than no run at all — it is
      # evidence the machinery works.
      #
      # This job only ever opens an issue in its OWN repository, which the
      # built-in GITHUB_TOKEN does. No secret to distribute, and it works in
      # every repository from its first commit.
      #
      # The cost is attribution: the issue is opened by `github-actions` rather
      # than `Datum Police ⚖`. B-06 chose an App for bot identity, and this is a
      # deliberate exception where the App bought nothing and cost coverage.
      - name: Say if deprecated credentials were passed
        env:
          APP_ID: ${{ secrets.app-id }}
        run: |
          set -euo pipefail
          if [ -n "${APP_ID:-}" ]; then
            echo "::notice::app-id/private-key are no longer used by main-watch-report and can be removed from the caller. This run used GITHUB_TOKEN."
          fi

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ inputs.failed }}
          DETAILS: ${{ inputs.details }}
          TITLE: ${{ inputs.title }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Find the existing issue by exact title. A label would need creating
          # first and can be deleted by anyone; the title is the stable handle.
          existing=$(gh issue list --repo "$REPO" --state open --limit 100 \
            --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")

          if [ "$FAILED" != "true" ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$REPO" \
                --body "\`main\` is green again as of [this run]($RUN_URL). Closing."
              gh issue close "$existing" --repo "$REPO"
              echo "::notice::main recovered — closed issue #$existing."
            else
              echo "::notice::main is healthy. Nothing to report."
            fi
            exit 0
          fi

          {
            echo "The scheduled watch found \`main\` failing gates that pass on pull requests."
            echo
            echo "This matters because **nothing else looks at \`main\`.** CI runs on pull"
            echo "requests, so a default branch can rot — a dependency moves, a pinned"
            echo "action is deleted, a gate is tightened upstream — and the next person to"
            echo "branch from it inherits a broken starting point."
            echo
            echo "**Failed:**"
            echo
            if [ -n "$DETAILS" ]; then
              printf '%s\n' "$DETAILS" | sed 's/^/- /'
            else
              echo "- see the run"
            fi
            echo
            echo "Run: $RUN_URL"
            echo
            echo "---"
            echo
            echo "Opened by \`main-watch\`. It closes itself when \`main\` passes again, so"
            echo "do not close it by hand — a closed issue over a broken \`main\` reopens next"
            echo "week and loses the history of how long it was broken."
          } > /tmp/issue-body.md

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file /tmp/issue-body.md
            echo "::notice::main is still broken — commented on issue #$existing."
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body-file /tmp/issue-body.md
            echo "::error::main is failing its own gates. Opened an issue."
          fi
